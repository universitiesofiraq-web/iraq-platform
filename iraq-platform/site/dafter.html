  <style>
    /* دفتري بشكل تطبيق الملاحظات (بطلب محمد 2026-11-19، بصورة مرجعية): خلفية داكنة منقّطة، عنوان كبير،
       شريط تصفية، بطاقات بمعاينة الصفحة الأولى، شريط تنقل عائم وزر إضافة. الصفحة داكنة دائماً مثل المرجع. */
    :root {
      --nt-bg: #0b0e13; --nt-dot: rgba(255,255,255,.07); --nt-card: #1d2127; --nt-card-line: rgba(255,255,255,.09);
      --nt-text: #f2f4f7; --nt-sub: #c4c8cf; --nt-muted: #8f959e; --nt-pill: #171b21; --nt-pill-line: rgba(255,255,255,.16);
      --nt-blue: #4f8cff; --nt-blue-soft: #1d355c; --nt-blue-text: #a9c7ff; --nt-fab: #4a86f7;
    }
    html, body.nt { background: var(--nt-bg); color: var(--nt-text); }
    body.nt { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "SF Arabic", "Segoe UI", Tahoma, sans-serif;
      padding-bottom: calc(120px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color: transparent; }
    .nt-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(var(--nt-dot) 1px, transparent 1.4px) 0 0 / 22px 22px, linear-gradient(180deg, #121821 0%, var(--nt-bg) 45%); }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; }
    .nt-wrap { max-width: 1100px; margin-inline: auto; padding-inline: 18px; }

    /* الرأس */
    .nt-head { padding-top: calc(14px + env(safe-area-inset-top)); }
    .nt-pill { display: flex; align-items: center; gap: 4px; width: max-content; padding: 6px;
      border-radius: 999px; background: var(--nt-pill); border: 1px solid var(--nt-pill-line); }
    .nt-pill button, .nt-pill a { display: grid; place-items: center; width: 52px; height: 48px; border: 0; border-radius: 999px; background: none; color: var(--nt-text); cursor: pointer; text-decoration: none; }
    .nt-pill .nt-brand { color: var(--nt-blue); }
    .nt-pill button:active, .nt-pill a:active { background: rgba(255,255,255,.08); }
    .nt-title { margin: 34px 0 6px; font-size: clamp(2.2rem, 9vw, 2.9rem); font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
    .nt-sub { margin: 0; color: var(--nt-sub); font-size: clamp(1.05rem, 4.4vw, 1.3rem); }
    .nt-search { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 0 16px; height: 50px; border-radius: 999px;
      background: var(--nt-pill); border: 1px solid var(--nt-pill-line); color: var(--nt-muted); }
    .nt-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--nt-text); font: inherit; font-size: 1.02rem; }

    /* شريط التصفية */
    .nt-chips { display: flex; align-items: center; gap: 6px; margin: 26px 0 22px; }
    .nt-chip { display: grid; place-items: center; min-width: 50px; height: 50px; padding: 0 12px; border: 0; border-radius: 999px; background: none;
      color: var(--nt-sub); cursor: pointer; }
    .nt-chip.nt-all { padding: 0 30px; font-size: 1.15rem; font-weight: 600; }
    .nt-chip[aria-pressed="true"] { background: var(--nt-blue-soft); color: var(--nt-blue-text); }
    .nt-more { margin-inline-start: auto; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%;
      border: 2px solid var(--nt-sub); background: none; color: var(--nt-sub); cursor: pointer; }

    /* البطاقات */
    .nt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    @media (min-width: 760px) { .nt-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (min-width: 1080px) { .nt-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .nt-card { position: relative; display: flex; flex-direction: column; overflow: hidden; border-radius: 26px; background: var(--nt-card);
      border: 1px solid var(--nt-card-line); box-shadow: 0 12px 28px -18px #000; transition: transform .15s ease; }
    .nt-card:active { transform: scale(.975); }
    .nt-hit { position: absolute; inset: 0; z-index: 1; border-radius: inherit; }
    .nt-hit:focus-visible { outline: 3px solid var(--nt-blue); outline-offset: -3px; }
    /* مثل المرجع: التاريخ والعنوان يبدآن من اليسار و••• في اليمين، والعنوان العربي يحاذي لغته */
    .nt-ch { display: grid; gap: 4px; padding: 14px 16px 10px; direction: ltr; }
    .nt-ch .nt-date { text-align: left; }
    .nt-ch-row { display: flex; align-items: center; gap: 4px; min-width: 0; }
    .nt-ch-row .nt-name { flex: 1; min-width: 0; }
    .nt-date { color: var(--nt-muted); font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nt-name { margin: 0; font-size: 1.12rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nt-dots { position: relative; z-index: 2; flex: none; width: 40px; height: 32px; margin-right: -8px; border: 0; border-radius: 12px; background: none;
      color: var(--nt-muted); cursor: pointer; font-size: 1.2rem; letter-spacing: 1px; line-height: 1; }
    .nt-dots:active { background: rgba(255,255,255,.08); }
    .nt-thumb { position: relative; aspect-ratio: 395 / 282; background: #fff; overflow: hidden; }
    .nt-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    .nt-badge { position: absolute; z-index: 2; bottom: 10px; inset-inline-start: 10px; padding: 3px 10px; border-radius: 999px; font-size: .75rem;
      background: rgba(10,14,20,.78); color: #fff; pointer-events: none; }

    /* معاينة بديلة تشبه صفحة ورقية حتى تجهز صورة الصفحة الأولى */
    .nt-ph { position: absolute; inset: 0; padding: 12% 10% 0; display: grid; align-content: start; gap: 8px; color: #1f2733; text-align: center; }
    .nt-ph b { font-size: clamp(.85rem, 3.4vw, 1.05rem); line-height: 1.3; color: var(--ph, #2d4f8a); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .nt-ph i { display: block; height: 5px; border-radius: 3px; background: #e6e9ee; margin-inline: 6%; }
    .nt-ph i:nth-of-type(2) { margin-inline: 14%; } .nt-ph i:nth-of-type(3) { margin-inline: 10%; }
    .nt-ph small { color: #7b8492; font-size: .72rem; }
    .nt-ph.nt-lined { padding: 10% 8% 0; text-align: start; background: repeating-linear-gradient(#fff 0 22px, #dfe6f1 22px 23px); }
    .nt-folder { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(160deg, var(--f1, #24324a), var(--f2, #141b28)); color: #fff; }
    .nt-folder span { font-size: 2.4rem; font-weight: 800; opacity: .92; }

    .nt-empty { color: var(--nt-muted); text-align: center; padding: 40px 10px; margin: 0; }

    /* القائمة المنبثقة */
    .nt-menu { position: fixed; z-index: 30; min-width: 210px; padding: 6px; border-radius: 18px; background: #262b33; border: 1px solid var(--nt-card-line);
      box-shadow: 0 18px 40px -12px #000; }
    .nt-menu button, .nt-menu a { display: block; width: 100%; padding: 12px 14px; border: 0; border-radius: 12px; background: none; color: var(--nt-text);
      text-align: start; text-decoration: none; cursor: pointer; font-size: .98rem; }
    .nt-menu button:hover, .nt-menu a:hover, .nt-menu button:focus-visible, .nt-menu a:focus-visible { background: rgba(255,255,255,.08); outline: 0; }
    .nt-menu hr { border: 0; border-top: 1px solid var(--nt-card-line); margin: 4px 6px; }
    .nt-menu [aria-checked="true"]::after { content: "  ✓"; color: var(--nt-blue-text); }

    /* شريط التنقل العائم وزر الإضافة */
    .nt-dock { direction: ltr; position: fixed; z-index: 20; bottom: calc(18px + env(safe-area-inset-bottom)); left: 18px; display: flex; gap: 4px; padding: 8px;
      border-radius: 999px; background: rgba(32,36,43,.94); border: 1px solid var(--nt-pill-line); box-shadow: 0 16px 36px -14px #000; backdrop-filter: blur(14px); }
    .nt-dock a, .nt-dock button { display: grid; place-items: center; width: 64px; height: 54px; border: 0; border-radius: 999px; background: none; color: var(--nt-sub); cursor: pointer; text-decoration: none; }
    .nt-dock [aria-current="page"] { background: var(--nt-blue-soft); color: var(--nt-blue-text); }
    .nt-fab { position: fixed; z-index: 20; bottom: calc(18px + env(safe-area-inset-bottom)); right: 18px; width: 70px; height: 70px; border: 0; border-radius: 50%;
      display: grid; place-items: center; background: var(--nt-fab); color: #fff; cursor: pointer; box-shadow: 0 14px 28px -10px rgba(74,134,247,.7); }
    .nt-fab:active, .nt-dock a:active, .nt-dock button:active { transform: scale(.94); }

    /* نافذة دفتر جديد */
    .nt-dlg { border: 0; padding: 22px; width: min(420px, 92vw); border-radius: 26px; background: #20242b; color: var(--nt-text); }
    .nt-dlg::backdrop { background: rgba(0,0,0,.55); }
    .nt-dlg h2 { margin: 0 0 14px; font-size: 1.2rem; }
    .nt-dlg input { width: 100%; box-sizing: border-box; height: 50px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--nt-pill-line); background: var(--nt-bg); color: var(--nt-text); font: inherit; font-size: 1rem; }
    .nt-dlg-act { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .nt-dlg-act button { height: 44px; padding: 0 18px; border-radius: 999px; border: 0; cursor: pointer; background: rgba(255,255,255,.08); }
    .nt-dlg-act .nt-ok { background: var(--nt-fab); color: #fff; font-weight: 600; }

    @media (prefers-reduced-motion: reduce) { .nt-card, .nt-fab, .nt-dock a { transition: none; } .nt-card:active { transform: none; } }
  </style>
</head>

        function render(f) {
          return loadLib().then(function (L) {
            return fetch(f.url, { credentials: "same-origin" }).then(function (r) { if (!r.ok) throw Error("HTTP " + r.status); return r.arrayBuffer(); }).then(function (buf) {
              return L.getDocument({ data: buf, disableFontFace: true, isEvalSupported: false, standardFontDataUrl: new URL("vendor/pdfjs/standard_fonts/", location.href).href }).promise;
            }).then(function (doc) {
              return doc.getPage(1).then(function (page) {
                var v1 = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: 460 / v1.width });
                var cv = document.createElement("canvas"); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
                cv.style.direction = "ltr";
                var ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
                return page.render({ canvasContext: ctx, viewport: vp }).promise.then(function () {
                  return new Promise(function (res) { cv.toBlob(function (b) { cv.width = cv.height = 0; res(b); }, "image/jpeg", 0.8); });
                });
              }).then(function (b) { doc.destroy(); return b; }, function (e) { doc.destroy(); throw e; });
            });
          });
        }
        function show(box, blob) {
          if (!blob || !box.isConnected) return;
          var img = new Image(); img.alt = ""; img.decoding = "async";
          img.onload = function () { var ph = box.querySelector(".nt-ph,.nt-folder"); if (ph) ph.remove(); };
          img.src = URL.createObjectURL(blob);
          box.insertBefore(img, box.firstChild);
        }
        function pump() {
          if (busy) return;
          var job = queue.shift(); if (!job) return;
          busy = true;
          var done = function () { busy = false; setTimeout(pump, 30); };
          allowed(job.f).then(function (ok) {
            if (!ok) return null;
            return render(job.f).then(function (b) { if (b) { put(job.key, b); memo[job.key] = b; } return b; });
          }).then(function (b) { if (b) job.boxes.forEach(function (x) { show(x, b); }); }).catch(function () { /* ملف تالف أو بلا اتصال: تبقى المعاينة البديلة */ }).then(done);
        }
        function want(box) {
          var key = box.dataset.key, f = box._file; if (!key || !f) return;
          if (memo[key]) return show(box, memo[key]);
          get(key).then(function (b) {
            if (b) { memo[key] = b; return show(box, b); }
            var j = queue.filter(function (q) { return q.key === key; })[0];
            if (j) j.boxes.push(box); else queue.push({ key: key, f: f, boxes: [box] });
            pump();
          });
        }
        function watch(box, f) {
          box._file = f; box.dataset.key = f.url + "|" + (f.size || "");
          if (!("IntersectionObserver" in window)) return want(box);
          io = io || new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { io.unobserve(e.target); want(e.target); } }); }, { rootMargin: "300px 0px" });
          io.observe(box);
        }
        function reset() { queue.length = 0; if (io) io.disconnect(); }
        return { watch: watch, reset: reset };
      })();

      /* ---------- بناء البطاقة ---------- */
      function card(o) {
        var a = el("article", "nt-card");
        var hit = el("a", "nt-hit"); hit.href = o.href; hit.setAttribute("aria-label", o.title); a.appendChild(hit);
        var ch = el("div", "nt-ch"), row = el("div", "nt-ch-row");
        var dt = el("span", "nt-date", o.date || " "); dt.setAttribute("dir", "auto"); ch.appendChild(dt);
        var h = el("h3", "nt-name" + (o.en ? " en" : ""), o.title); h.setAttribute("dir", "auto");
        row.appendChild(h);
        ch.appendChild(row);
        var dots = el("button", "nt-dots"); dots.type = "button"; dots.setAttribute("aria-label", "خيارات: " + o.title); dots.setAttribute("aria-haspopup", "menu");
        dots.appendChild(svg("dots", 24, 2.2));
        dots.addEventListener("click", function (e) { e.stopPropagation(); openMenu(dots, o.menu()); });
        row.appendChild(dots);
        a.appendChild(ch);
        var th = el("div", "nt-thumb");
        th.appendChild(o.ph);
        if (o.badge) th.appendChild(el("span", "nt-badge", o.badge));
        a.appendChild(th);
        if (o.file) Thumbs.watch(th, o.file);
        return a;
      }
      function pagePh(head, title, sub) {
        var p = el("div", "nt-ph"); p.style.setProperty("--ph", head);
        var b = el("b", "en", title); b.setAttribute("dir", "auto"); p.appendChild(b);
        if (sub) p.appendChild(el("small", "en", sub));
        p.appendChild(el("i")); p.appendChild(el("i")); p.appendChild(el("i"));
        return p;
      }
      function folderPh(c) {
        var h = hue(c.id), f = el("div", "nt-folder"); f.style.setProperty("--f1", h[1]); f.style.setProperty("--f2", h[2]);
        f.appendChild(svg("book", 44, 1.8)); return f;
      }

      /* ---------- القائمة المنبثقة ---------- */
      var menu = $("ntMenu"), menuFrom = null;
      function closeMenu() { if (menu.hidden) return; menu.hidden = true; if (menuFrom) { menuFrom.setAttribute("aria-expanded", "false"); menuFrom.focus(); } menuFrom = null; }
      function openMenu(btn, items) {
        menu.textContent = "";
        items.forEach(function (it) {
          if (it === "-") return menu.appendChild(el("hr"));
          var n = it.href ? el("a") : el("button"); n.textContent = it.label; n.setAttribute("role", it.checked != null ? "menuitemradio" : "menuitem");
          if (it.checked != null) n.setAttribute("aria-checked", String(!!it.checked));
          if (it.href) n.href = it.href; else { n.type = "button"; n.addEventListener("click", function () { closeMenu(); it.run(); }); }
          menu.appendChild(n);
        });
        menu.hidden = false; menuFrom = btn; btn.setAttribute("aria-expanded", "true");
        var r = btn.getBoundingClientRect(), mw = menu.offsetWidth, mh = menu.offsetHeight;
        var left = Math.min(Math.max(8, r.left), innerWidth - mw - 8), top = r.bottom + 6;
        if (top + mh > innerHeight - 8) top = Math.max(8, r.top - mh - 6);
        menu.style.left = left + "px"; menu.style.top = top + "px";
        var first = menu.querySelector("a,button"); if (first) first.focus();
      }
      document.addEventListener("click", function (e) { if (!menu.hidden && !menu.contains(e.target)) closeMenu(); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeMenu(); });
      addEventListener("scroll", closeMenu, { passive: true });

      /* ---------- الحالة ---------- */
      var st = { view: "home", subject: null, filter: "all", q: "" };
      var FILTERS = {
        home: [{ id: "fav", icon: "star", label: "المفضلة" }, { id: "nb", icon: "pen", label: "دفاتري" }, { id: "subj", icon: "book", label: "المواد" }],
        subject: [{ id: "unread", icon: "open", label: "غير المقروءة" }, { id: "read", icon: "check", label: "المقروءة" }]
      };
      function chips() {
        var box = $("ntChips"); box.textContent = "";
        var all = el("button", "nt-chip nt-all", "الجميع"); all.type = "button"; all.setAttribute("aria-pressed", String(st.filter === "all"));
        all.addEventListener("click", function () { st.filter = "all"; paint(); });
        box.appendChild(all);
        FILTERS[st.view].forEach(function (f) {
          var b = el("button", "nt-chip"); b.type = "button"; b.title = f.label; b.setAttribute("aria-label", f.label); b.setAttribute("aria-pressed", String(st.filter === f.id));
          b.appendChild(svg(f.icon, 28, 2)); b.addEventListener("click", function () { st.filter = st.filter === f.id ? "all" : f.id; paint(); });
          box.appendChild(b);
        });
        var more = el("button", "nt-more"); more.type = "button"; more.setAttribute("aria-label", "الترتيب"); more.setAttribute("aria-haspopup", "menu");
        more.appendChild(svg("dots", 24, 2.6));
        more.addEventListener("click", function (e) {
          e.stopPropagation();
          var key = st.view === "home" ? "sortHome" : "sortSubj", cur = pref(key, st.view === "home" ? "recent" : "number");
          var opts = st.view === "home" ? [["recent", "الأحدث أولاً"], ["name", "حسب الاسم"]] : [["number", "حسب رقم المحاضرة"], ["recent", "الأحدث رفعاً"]];
          openMenu(more, opts.map(function (o) { return { label: o[1], checked: cur === o[0], run: function () { setPref(key, o[0]); paint(); } }; }));
        });
        box.appendChild(more);
      }

      /* ---------- العرض الرئيسي: دفاتري + المواد ---------- */
      function homeItems() {
        var items = [];
        notebooks().forEach(function (n) {
          var title = String(n.title || "دفتر");
          items.push({ kind: "nb", t: Number(n.created) || 0, name: title, build: function () {
            var ph = el("div", "nt-ph nt-lined"); var b = el("b", "", title); b.setAttribute("dir", "auto"); ph.appendChild(b);
            var href = readerHref("notebook:" + n.id);
            return card({ title: title, date: fmt(Number(n.created) || 0), href: href, ph: ph,
              menu: function () { return [{ label: "فتح الدفتر", href: href }]; } });
          } });
        });
        COURSES_.forEach(function (c) {
          var t = c.lectures.reduce(function (m, l) { var a = lastAdded(l); return a > m ? a : m; }, "");
          var sorted = c.lectures.slice().sort(function (a, b) { return a.number - b.number; });
          var first = null; for (var i = 0; i < sorted.length && !first; i++) first = pdfOf(sorted[i]);
          items.push({ kind: "subj", t: t ? new Date(t).getTime() || 0 : 0, name: c.name, fav: !!(window.MS && MS.favs && MS.favs.has(c.id)), build: function () {
            var href = "#s=" + encodeURIComponent(c.id), fav = MS.favs && MS.favs.has(c.id);
            var n = c.lectures.length;
            return card({ title: c.name, en: true, date: t ? fmt(String(t).slice(0, 10)) : (n ? n + " محاضرة" : "لا محاضرات بعد"), href: href, file: first,
              ph: folderPh(c),
              menu: function () {
                return [{ label: "فتح المادة", href: href }, { label: "صفحة المادة في المنصة", href: "course.html?id=" + encodeURIComponent(c.id) }, "-",
                  { label: fav ? "إزالة من المفضلة" : "إضافة إلى المفضلة", run: function () { MS.favs.toggle(c.id); paint(); } }];
              } });
          } });
        });
        return items;
      }

      /* ---------- عرض المادة: محاضراتها كبطاقات ---------- */
      function subjectItems(c) {
        var h = hue(c.id), items = [];
        c.lectures.forEach(function (l) {
          var t = lastAdded(l), f = pdfOf(l), read = !!(MS.progress && MS.progress.isRead(c.id, l.number));
          var name = l.title || ("المحاضرة " + l.number);
          items.push({ kind: read ? "read" : "unread", n: l.number, t: t ? new Date(t).getTime() || 0 : 0, name: name + " " + l.number, build: function () {
            var href = f ? readerHref(f.url) : lectureHref(c, l);
            return card({ title: name, en: true, date: (read ? "✓ " : "") + (t ? fmt(t) : "بلا ملف بعد"), href: href, file: f,
              ph: pagePh(h[0], name, c.name),
              menu: function () {
                var m = [];
                if (f) m.push({ label: "اكتب وظلّل", href: readerHref(f.url) });
                m.push({ label: "صفحة المحاضرة", href: lectureHref(c, l) });
                if (f) m.push({ label: "فتح الملف", href: f.url });
                m.push("-");
                m.push({ label: read ? "تعليمها غير مقروءة" : "تعليمها مقروءة", run: function () { MS.progress.toggle(c.id, l.number); paint(); } });
                return m;
              } });
          } });
        });
        return items;
      }

      function paint() {
        closeMenu();
        Thumbs.reset();
        chips();
        var q = norm(st.q.trim()), items, sort;
        if (st.view === "subject") {
          items = subjectItems(st.subject);
          if (st.filter !== "all") items = items.filter(function (i) { return i.kind === st.filter; });
          sort = pref("sortSubj", "number");
          items.sort(sort === "recent" ? function (a, b) { return b.t - a.t || a.n - b.n; } : function (a, b) { return a.n - b.n; });
        } else {
          items = homeItems();
          if (st.filter === "fav") items = items.filter(function (i) { return i.fav; });
          else if (st.filter !== "all") items = items.filter(function (i) { return i.kind === st.filter; });
          sort = pref("sortHome", "recent");
          items.sort(sort === "name" ? function (a, b) { return String(a.name).localeCompare(String(b.name), "ar"); } : function (a, b) { return b.t - a.t; });
        }
        if (q) items = items.filter(function (i) { return norm(i.name).indexOf(q) !== -1; });
        var grid = $("ntGrid"); grid.textContent = "";
        items.forEach(function (i) { grid.appendChild(i.build()); });
        var empty = $("ntEmpty");
        empty.hidden = !!items.length;
        if (!items.length) {
          empty.textContent = q ? "لا نتائج لهذا البحث." :
            st.view === "subject" ? (st.filter === "read" ? "لم تعلّم أي محاضرة مقروءة بعد." : st.filter === "unread" ? "قرأت كل محاضرات هذه المادة." : "لا توجد محاضرات بعد.") :
            st.filter === "fav" ? "أضف مادة إلى المفضلة من زر ••• في بطاقتها." : st.filter === "nb" ? "اضغط + لإنشاء أول دفتر." : "لا توجد مواد بعد.";
        }
      }

      function route() {
        var m = /^#s=(.+)$/.exec(location.hash || ""), c = m ? byId(decodeURIComponent(m[1])) : null;
        var changed = (c ? "subject" : "home") !== st.view || c !== st.subject;
        st.view = c ? "subject" : "home"; st.subject = c;
        if (changed) { st.filter = "all"; st.q = ""; $("ntQ").value = ""; }
        $("ntBack").hidden = !c;
        $("ntTitle").textContent = c ? c.name : "مرحبًا";
        $("ntTitle").className = "nt-title" + (c ? " en" : "");
        $("ntTitle").setAttribute("dir", c ? "auto" : "rtl");
        $("ntSub").textContent = c ? (c.lectures.length + " محاضرة") : "ماذا ستذاكر اليوم؟";
        $("ntQ").placeholder = c ? "ابحث في محاضرات المادة" : "ابحث في دفتري";
        document.title = (c ? c.name + " | " : "") + "دفتري | دفعتنا";
        paint();
        if (changed) scrollTo(0, 0);
      }

      $("ntBack").addEventListener("click", function () { location.hash = ""; });
      $("ntSearchBtn").addEventListener("click", function () {
        var box = $("ntSearch"), open = box.hidden; box.hidden = !open; this.setAttribute("aria-expanded", String(open));
        if (open) $("ntQ").focus(); else if (st.q) { st.q = ""; $("ntQ").value = ""; paint(); }
      });
      $("ntQ").addEventListener("input", function () { st.q = this.value; paint(); });

      /* + : دفتر جديد (نفس مخزن دفاتر «اكتب وظلّل») */
      var dlg = $("ntDlg");
      $("ntNew").addEventListener("click", function () { $("ntDlgIn").value = ""; if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", ""); $("ntDlgIn").focus(); });
      $("ntDlgNo").addEventListener("click", function () { dlg.close(); });
      $("ntDlgForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var title = $("ntDlgIn").value.trim().slice(0, 60) || "دفتر";
        var id = "n" + Math.random().toString(36).slice(2, 9), list = notebooks();
        list.push({ id: id, title: title, created: Date.now() });
        try { localStorage.setItem(NBKEY, JSON.stringify(list)); } catch (err) { dlg.close(); return; }
        dlg.close();
        location.href = readerHref("notebook:" + id);
      });

      addEventListener("hashchange", route);
      addEventListener("pageshow", function (e) { if (e.persisted) paint(); });
      route();
    })();
  </script>
  <script>
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
    }
  </script>
