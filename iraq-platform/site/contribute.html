<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>رفع ملف | المنصة العراقية</title>
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <meta name="theme-color" content="#13294B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/iq.css?v=2">
</head>
<body>
  <header class="iq-top">
    <a class="iq-brand" href="/"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="7" y="7" width="18" height="18" rx="2" fill="#E0A93B"/><rect x="7" y="7" width="18" height="18" rx="2" transform="rotate(45 16 16)" fill="#E0A93B"/><circle cx="16" cy="16" r="4" fill="#0A1C4E"/></svg><span>المنصة العراقية</span></a>
    <nav><a href="catalog.html">الجامعات</a><a href="contribute.html" data-upload-link hidden>رفع ملف</a><a class="iq-login" href="login.html">دخول</a></nav>
  </header>
  <main class="ct">
    <a class="back" href="catalog.html">← الجامعات</a>
    <h1>رفع ملف لمادة</h1>
    <p class="ct-note" id="gate">جارٍ التحقق من حسابك…</p>
    <div id="form" hidden>
      <p class="ct-note" id="note"></p>
      <label for="u">الجامعة</label><select id="u"></select>
      <label for="c">الكلية</label><select id="c"></select>
      <label for="d">القسم</label><select id="d"></select>
      <label for="s">المادة</label><select id="s"></select>
      <details class="ct-add" id="addSub" hidden>
        <summary>مادتي غير موجودة؟ أضفها</summary>
        <label for="an">اسم المادة</label><input id="an" maxlength="120" placeholder="مثال: التشريح">
        <div class="ct-row">
          <div><label for="as">المرحلة</label><select id="as"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div>
          <div><label for="at">الكورس</label><select id="at"><option>1</option><option>2</option><option>3</option></select></div>
        </div>
        <button class="btn btn-secondary" id="addGo" type="button">إضافة المادة</button>
      </details>
      <div class="ct-row">
        <div><label for="t">النوع</label>
          <select id="t"><option value="lecture">محاضرة</option><option value="exam">أسئلة سنوات سابقة</option><option value="quiz">اختبار</option></select></div>
        <div><label for="n">رقم المحاضرة</label><input id="n" type="number" min="0" max="999" value="1"></div>
      </div>
      <label for="ti">عنوان المحاضرة</label><input id="ti" maxlength="200" placeholder="مثال: مقدمة">
      <label for="lb">وصف الملف</label><input id="lb" maxlength="120" value="ملزمة">
      <label for="f">ملف PDF (حتى 20 ميغا)</label><input id="f" type="file" accept="application/pdf,.pdf">
      <label for="lk">أو رابط بدل الملف (اختياري)</label><input id="lk" type="url" placeholder="https://" dir="ltr">
      <div class="ct-bar" id="bar" hidden><i id="fill"></i></div>
      <button class="btn btn-primary" id="go" type="button">رفع</button>
      <p class="ct-msg" id="msg" role="alert"></p>
    </div>
  </main>
  <script src="js/api-client.js"></script>
  <script>
  (function () {
    var $ = function (i) { return document.getElementById(i); };
    var CH = 2 * 1024 * 1024, MAX = 20 * 1024 * 1024;
    var params = new URLSearchParams(location.search);
    var pre = Number(params.get("subject")) || 0;
    var options = null, subjectPermissions = new Map();
    var stageQuery = params.has("stage_id") ? "&stage_id=" + encodeURIComponent(params.get("stage_id")) : "";
    var selectionVersion = 0;

    var U = $("u"), C = $("c"), D = $("d"), S = $("s");
    function fill(sel, items, placeholder, preferred) {
      sel.replaceChildren(new Option(placeholder, ""));
      items.forEach(function (item) { sel.appendChild(new Option(item.name_ar, item.id)); });
      var selected = items.find(function (item) { return item.id === Number(preferred); });
      sel.value = selected ? String(selected.id) : (!options.admin && items.length === 1 ? String(items[0].id) : "");
      sel.disabled = !items.length || (!options.admin && items.length === 1);
    }
    function publicationNote() {
      var canPublish = subjectPermissions.get(S.value);
      $("go").disabled = !S.value || !subjectPermissions.has(S.value);
      $("note").textContent = !S.value ? "اختر مادة ضمن نطاق صلاحياتك للرفع إليها." :
        canPublish ? "ملفات هذه المادة تُنشر مباشرة ضمن صلاحياتك." : "ملفات هذه المادة تظهر بعد موافقة مسؤولها أو ممثلها.";
    }
    $("addGo").onclick = function () {
      var name = $("an").value.trim();
      if (!name || !D.value) { $("msg").textContent = "اكتب اسم المادة واختر القسم."; return; }
      $("addGo").disabled = true; $("msg").textContent = "جارٍ إضافة المادة…";
      fetch("/api/catalog/add", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" },
        body: JSON.stringify({ type: "subject", department_id: Number(D.value), name_ar: name, stage: Number($("as").value), term: Number($("at").value) }) })
        .then(function (r) { return r.json().then(function (d) { return { st: r.status, d: d }; }); })
        .then(function (x) {
          $("addGo").disabled = false;
          if (x.d && x.d.ok) { $("an").value = ""; $("msg").textContent = "تمت إضافة المادة، اخترها الآن وارفع ملفك."; $("addSub").open = false; return loadSubjects({ id: x.d.id }); }
          $("msg").textContent = x.st === 403 ? "إضافة المواد لممثل القسم أو الكلية فقط." : "تعذّرت الإضافة، حاول مرة أخرى.";
        }).catch(function () { $("addGo").disabled = false; $("msg").textContent = "تعذّر الاتصال بالخادم."; });
    };
    function loadSubjects(preferred) {
      var request = ++selectionVersion;
      $("addSub").hidden = !D.value;
      subjectPermissions.clear();
      fill(S, [], "اختر المادة"); publicationNote();
      if (!D.value) return Promise.resolve();
      $("note").textContent = "جارٍ تحميل مواد القسم المسموح بها…";
      return IQApi.request("/api/upload-options?department_id=" + D.value + "&college_id=" + C.value + "&university_id=" + U.value + stageQuery)
        .then(function (data) {
          if (request !== selectionVersion) return;
          var items = data.items.map(function (item) {
            subjectPermissions.set(String(item.id), item.can_publish);
            return { id: item.id, name_ar: "المرحلة " + item.stage + " — الكورس " + item.term + " — " + item.name_ar };
          });
          fill(S, items, items.length ? "اختر المادة" : "لا توجد مواد مسموح بها في هذا القسم", preferred && preferred.id);
          publicationNote();
          if (!items.length) $("note").textContent = "لا توجد مواد في هذا القسم بعد. إن كنت ممثل القسم فاضغط «مادتي غير موجودة؟ أضفها» أدناه.";
        }).catch(function (error) {
          if (request !== selectionVersion) return;
          $("note").textContent = "تعذّر تحميل مواد القسم.";
          IQApi.showError($("msg"), error, function () { msg(""); loadSubjects(); });
        });
    }
    function loadDepartments(preferred) {
      var items = options.departments.filter(function (item) { return item.college_id === Number(C.value); });
      fill(D, items, "اختر القسم", preferred && preferred.department_id);
      return loadSubjects(preferred);
    }
    function loadColleges(preferred) {
      var items = options.colleges.filter(function (item) { return item.university_id === Number(U.value); });
      fill(C, items, "اختر الكلية", preferred && preferred.college_id);
      return loadDepartments(preferred);
    }
    U.addEventListener("change", function () { msg(""); loadColleges(); });
    C.addEventListener("change", function () { msg(""); loadDepartments(); });
    D.addEventListener("change", function () { msg(""); loadSubjects(); });
    S.addEventListener("change", publicationNote);
    $("go").disabled = true;

    function msg(t, ok) { var m = $("msg"); m.textContent = t; m.style.color = ok ? "#2f855a" : "#c53030"; }
    function post(p, body, raw) {
      return IQApi.request("/api/" + p, { method: "POST", headers: raw ? {} : { "content-type": "application/json" }, body: raw || JSON.stringify(body) })
        .catch(function (error) { return { ok: false, error: error.code || "network" }; });
    }
    function uuid() { return crypto.randomUUID(); }
    var ERR = { not_pdf: "الملف ليس PDF صالحاً.", too_big: "الملف أكبر من 20 ميغا.", unauthorized: "سجّل الدخول أولاً.", forbidden: "لا تملك صلاحية.", bad_request: "تحقق من الرقم والعنوان." };
    function er(d) { return ERR[d.error] || IQApi.errorText(d.error); }

    $("go").onclick = function () {
      var sid = S.value;
      if (!sid || !subjectPermissions.has(sid)) return msg("اختر مادة مسموحًا لك بالرفع إليها أولاً.");
      var type = $("t").value, num = Number($("n").value) || 0, title = $("ti").value.trim(), label = $("lb").value.trim();
      if (type === "lecture" && num < 1) return msg("رقم المحاضرة يبدأ من 1.");
      if (num > 0 && !title) return msg("اكتب عنوان المحاضرة.");
      if (!label) return msg("اكتب وصف الملف.");
      var cid = "s" + sid, file = $("f").files[0], url = $("lk").value.trim();
      var selectors = [U, C, D, S], disabled = selectors.map(function (sel) { return sel.disabled; });
      selectors.forEach(function (sel) { sel.disabled = true; });
      $("go").disabled = true; msg("");
      var done = function (d) {
        selectors.forEach(function (sel, i) { sel.disabled = disabled[i]; });
        publicationNote(); $("bar").hidden = true;
        if (d.ok) { msg(d.status === "pending" ? "تم الرفع، وسيظهر بعد موافقة المسؤول." : d.status === "approved" ? "تم الرفع والنشر." : "تم حفظ الملف بنجاح.", true); $("f").value = ""; $("lk").value = ""; }
        else if (d.error === "forbidden" || d.error === "unauthorized") IQApi.showError($("msg"), { code: d.error }, loadOptions);
        else msg(er(d));
      };
      if (url) return post("link", { courseId: cid, type: type, number: num, title: num ? title : "", label: label, url: url }).then(done);
      if (!file || file.size > MAX) {
        selectors.forEach(function (sel, i) { sel.disabled = disabled[i]; });
        publicationNote();
        return msg(file ? ERR.too_big : "اختر ملفاً أو اكتب رابطاً.");
      }
      var id = uuid(), total = Math.ceil(file.size / CH), i = 0;
      $("bar").hidden = false;
      (function next() {
        if (i >= total) {
          return post("finish", { id: id, chunks: total, courseId: cid, number: num, type: type, title: num ? title : "", label: label, filename: file.name }).then(done);
        }
        file.slice(i * CH, (i + 1) * CH).arrayBuffer().then(function (buf) {
          return post("chunk?id=" + id + "&index=" + i + "&courseId=" + encodeURIComponent(cid), null, buf);
        }).then(function (d) {
          if (!d.ok) return done(d);
          i++; $("fill").style.width = Math.round(i / total * 100) + "%"; next();
        }).catch(function () { done({ ok: false, error: "network" }); });
      })();
    };

    function loadOptions() {
      $("form").hidden = true; $("gate").hidden = false;
      $("gate").textContent = "جارٍ تحميل نطاق الرفع المسموح لحسابك…";
      return IQApi.request("/api/upload-options" + (stageQuery ? "?" + stageQuery.slice(1) : ""))
        .then(function (data) {
          options = data;
          if (!options.universities.length) {
            var error = new Error("forbidden"); error.code = "forbidden"; throw error;
          }
          if (pre) return IQApi.request("/api/upload-options?subject_id=" + pre + stageQuery)
            .then(function (data) { return data.items[0]; });
        }).then(function (preferred) {
          fill(U, options.universities, "اختر الجامعة", preferred && preferred.university_id);
          return loadColleges(preferred);
        }).then(function () {
          $("gate").hidden = true; $("form").hidden = false;
        }).catch(function (error) {
          IQApi.showError($("gate"), error, loadOptions);
          if (error.code === "unauthorized") {
            var login = document.createElement("a");
            login.href = "login.html?next=" + encodeURIComponent("contribute.html" + location.search);
            login.textContent = "تسجيل الدخول"; $("gate").appendChild(login);
          }
        });
    }
    loadOptions();
  })();
  </script>
  <script src="js/upload-link.js"></script>
</body>
</html>
