<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>رفع ملف | المنصة العراقية</title>
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <meta name="theme-color" content="#13294B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/iq.css?v=1">
</head>
<body>
  <header class="iq-top">
    <a class="iq-brand" href="/"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="7" y="7" width="18" height="18" rx="2" fill="#E0A93B"/><rect x="7" y="7" width="18" height="18" rx="2" transform="rotate(45 16 16)" fill="#E0A93B"/><circle cx="16" cy="16" r="4" fill="#0A1C4E"/></svg><span>المنصة العراقية</span></a>
    <nav><a href="catalog.html">الجامعات</a><a href="contribute.html">رفع ملف</a><a class="iq-login" href="login.html">دخول</a></nav>
  </header>
  <main class="ct">
    <a class="back" href="catalog.html">← الجامعات</a>
    <h1>رفع ملف لمادة</h1>
    <p class="ct-note" id="gate">جارٍ التحقق من حسابك…</p>
    <div id="form" hidden>
      <p class="ct-note" id="note"></p>
      <label for="u">الجامعة</label><select id="u"></select>
      <label for="c">الكلية</label><select id="c"></select>
      <label for="d">القسم</label><select id="d"></select>
      <label for="s">المادة</label><select id="s"></select>
      <div class="ct-row">
        <div><label for="t">النوع</label>
          <select id="t"><option value="lecture">محاضرة</option><option value="exam">أسئلة سنوات سابقة</option><option value="quiz">اختبار</option></select></div>
        <div><label for="n">رقم المحاضرة</label><input id="n" type="number" min="0" max="999" value="1"></div>
      </div>
      <label for="ti">عنوان المحاضرة</label><input id="ti" maxlength="200" placeholder="مثال: مقدمة">
      <label for="lb">وصف الملف</label><input id="lb" maxlength="120" value="ملزمة">
      <label for="f">ملف PDF (حتى 20 ميغا)</label><input id="f" type="file" accept="application/pdf,.pdf">
      <label for="lk">أو رابط بدل الملف (اختياري)</label><input id="lk" type="url" placeholder="https://" dir="ltr">
      <div class="ct-bar" id="bar" hidden><i id="fill"></i></div>
      <button class="btn btn-primary" id="go" type="button">رفع</button>
      <p class="ct-msg" id="msg" role="alert"></p>
    </div>
  </main>
  <script>
  (function () {
    var $ = function (i) { return document.getElementById(i); };
    var CH = 2 * 1024 * 1024, MAX = 20 * 1024 * 1024;
    var pre = Number(new URLSearchParams(location.search).get("subject")) || 0;
    var role = "";

    function get(p) { return fetch("/api/catalog/" + p).then(function (r) { return r.json(); }).then(function (d) { return d.items || []; }); }
    function fill(sel, items, ph) {
      sel.innerHTML = ""; var o = new Option(ph, ""); sel.appendChild(o);
      items.forEach(function (it) { sel.appendChild(new Option(it.name_ar, it.id)); });
    }
    function cascade(sel, next, fn, ph) {
      sel.addEventListener("change", function () {
        next.innerHTML = ""; if (next.onreset) next.onreset();
        if (sel.value) fn(sel.value).then(function (items) { fill(next, items, ph); });
      });
    }
    var U = $("u"), C = $("c"), D = $("d"), S = $("s");
    C.onreset = function () { D.innerHTML = ""; S.innerHTML = ""; };
    D.onreset = function () { S.innerHTML = ""; };
    cascade(U, C, function (v) { return get("colleges?university_id=" + v); }, "اختر الكلية");
    cascade(C, D, function (v) { return get("departments?college_id=" + v); }, "اختر القسم");
    cascade(D, S, function (v) {
      return get("subjects?department_id=" + v).then(function (a) {
        return a.map(function (x) { return { id: x.id, name_ar: "م" + x.stage + " ك" + x.term + " — " + x.name_ar }; });
      });
    }, "اختر المادة");

    function msg(t, ok) { var m = $("msg"); m.textContent = t; m.style.color = ok ? "#2f855a" : "#c53030"; }
    function post(p, body, raw) {
      return fetch("/api/" + p, { method: "POST", headers: raw ? {} : { "content-type": "application/json" }, body: raw || JSON.stringify(body) })
        .then(function (r) { return r.json().catch(function () { return { ok: false, error: "server" }; }); });
    }
    function uuid() { return crypto.randomUUID(); }
    var ERR = { not_pdf: "الملف ليس PDF صالحاً.", too_big: "الملف أكبر من 20 ميغا.", unauthorized: "سجّل الدخول أولاً.", forbidden: "لا تملك صلاحية.", bad_request: "تحقق من الرقم والعنوان." };
    function er(d) { return ERR[d.error] || "تعذّر الرفع، حاول مرة أخرى."; }

    $("go").onclick = function () {
      var sid = S.value; if (!sid) return msg("اختر المادة أولاً.");
      var type = $("t").value, num = Number($("n").value) || 0, title = $("ti").value.trim(), label = $("lb").value.trim();
      if (type === "lecture" && num < 1) return msg("رقم المحاضرة يبدأ من 1.");
      if (num > 0 && !title) return msg("اكتب عنوان المحاضرة.");
      if (!label) return msg("اكتب وصف الملف.");
      var cid = "s" + sid, file = $("f").files[0], url = $("lk").value.trim();
      $("go").disabled = true; msg("");
      var done = function (d) {
        $("go").disabled = false; $("bar").hidden = true;
        if (d.ok) { msg(role === "uploader" ? "تم الرفع، وسيظهر بعد موافقة المشرف." : "تم الرفع والنشر.", true); $("f").value = ""; $("lk").value = ""; }
        else msg(er(d));
      };
      if (url) return post("link", { courseId: cid, type: type, number: num, title: num ? title : "", label: label, url: url }).then(done);
      if (!file) { $("go").disabled = false; return msg("اختر ملفاً أو اكتب رابطاً."); }
      if (file.size > MAX) { $("go").disabled = false; return msg(ERR.too_big); }
      var id = uuid(), total = Math.ceil(file.size / CH), i = 0;
      $("bar").hidden = false;
      (function next() {
        if (i >= total) {
          return post("finish", { id: id, chunks: total, courseId: cid, number: num, type: type, title: num ? title : "", label: label, filename: file.name }).then(done);
        }
        file.slice(i * CH, (i + 1) * CH).arrayBuffer().then(function (buf) {
          return post("chunk?id=" + id + "&index=" + i, null, buf);
        }).then(function (d) {
          if (!d.ok) return done(d);
          i++; $("fill").style.width = Math.round(i / total * 100) + "%"; next();
        });
      })();
    };

    fetch("/api/auth/me").then(function (r) { return r.json(); }).then(function (d) {
      var usr = d && d.user; role = usr && usr.role;
      if (!role) { $("gate").innerHTML = 'سجّل الدخول أولاً: <a href="login.html">تسجيل الدخول</a>'; return; }
      var sc = (usr.scopes || []), isRep = usr.admin || sc.some(function (x) { return x.level === "rep"; });
      if (!isRep && ["uploader", "rep", "admin"].indexOf(role) < 0 && !sc.length) { $("gate").textContent = "حسابك طالب. اطلب من ممثل قسمك تفعيل صلاحية الرفع لك."; return; }
      role = isRep ? "rep" : "uploader";
      $("gate").hidden = true; $("form").hidden = false;
      $("note").textContent = role === "uploader" ? "ملفاتك تظهر بعد موافقة المشرف أو ممثل الكلية." : "ملفاتك تُنشر مباشرة.";
      get("universities").then(function (items) {
        fill(U, items, "اختر الجامعة");
        if (!pre) return;
        fetch("/api/catalog/subject?id=" + pre).then(function (r) { return r.json(); }).then(function (x) {
          if (!x.ok) return; var s = x.item;
          U.value = s.university_id;
          get("colleges?university_id=" + s.university_id).then(function (cs) { fill(C, cs, "اختر الكلية"); C.value = s.college_id; return get("departments?college_id=" + s.college_id); })
            .then(function (ds) { fill(D, ds, "اختر القسم"); D.value = s.department_id; return get("subjects?department_id=" + s.department_id); })
            .then(function (ss) { fill(S, ss.map(function (y) { return { id: y.id, name_ar: "م" + y.stage + " ك" + y.term + " — " + y.name_ar }; }), "اختر المادة"); S.value = s.id; });
        });
      });
    }).catch(function () { $("gate").textContent = "تعذّر التحقق من الحساب."; });
  })();
  </script>
</body>
</html>
