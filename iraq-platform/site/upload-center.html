<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#13294B">
  <title>مركز الرفع | المنصة العراقية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/iq.css?v=5">
  <link rel="stylesheet" href="css/upload-center.css?v=1">
</head>
<body>
  <main class="uc2">
    <a class="uc2-back" href="platform.html">← المنصة</a>
    <div class="uc2-panel">
      <div class="uc2-head">
        <span class="uc2-orb" id="orb"></span>
        <div class="uc2-ttl"><h1>رفع الملفات</h1><p class="uc2-sub" id="sub"></p></div>
        <span class="uc2-pill" id="pill"><i></i><span id="pillT">جارٍ التحقق</span></span>
      </div>
      <p class="uc2-gate" id="gate">جارٍ التحقق من صلاحياتك…</p>
      <div class="uc2-body" id="main" hidden>
        <section class="uc2-ctx">
          <div class="uc2-college">
            <span class="uc2-logo"><img id="logo" alt="" hidden><span id="logoFb">🎓</span></span>
            <div><b id="cName"></b><small id="cPath"></small></div>
            <label class="uc2-logobtn" id="logoBtn" hidden>شعار الكلية<input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp" hidden></label>
          </div>
          <div class="uc2-fields">
            <div id="collegeRow"><label for="c">الكلية</label><select id="c"></select></div>
            <div id="deptRow"><label for="d">القسم</label><select id="d"></select></div>
            <div class="wide"><label for="s">المادة</label><select id="s"></select></div>
            <div class="wide"><div class="uc2-seg" id="typeSeg" role="tablist">
              <button type="button" role="tab" data-v="lecture" aria-selected="true">محاضرات</button>
              <button type="button" role="tab" data-v="exam" aria-selected="false">أسئلة سابقة</button>
              <button type="button" role="tab" data-v="quiz" aria-selected="false">اختبارات</button>
            </div></div>
          </div>
        </section>

        <div class="uc2-drop" id="drop" tabindex="0" role="button" aria-label="اسحب الملفات وأفلتها هنا">
          <div class="uc2-drop-in">
            <span class="uc2-dicon" id="dicon"></span>
            <h2>اسحب الملفات وأفلتها هنا</h2>
            <p>ملفات PDF (حتى 20 ميغا للملف) · تقدر تختار عشرات الملفات مرة وحدة، وغير PDF ضعه رابطاً</p>
            <div class="uc2-btns">
              <button class="uc2-btn p" id="pickFiles" type="button"><span class="i-file"></span>اختر ملفات</button>
              <button class="uc2-btn" id="pickFolder" type="button"><span class="i-folder"></span>اختر مجلد</button>
              <button class="uc2-btn" id="linksBtn" type="button"><span class="i-link"></span>لصق روابط</button>
            </div>
          </div>
          <input id="fileInput" type="file" multiple accept="application/pdf,.pdf" hidden>
          <input id="folderInput" type="file" multiple webkitdirectory hidden>
        </div>

        <div class="uc2-links" id="linksPanel" hidden>
          <label for="linksText">الصق الروابط (كل رابط بسطر، وتكدر تكتب اسماً قبله)</label>
          <textarea id="linksText" rows="4" dir="ltr" placeholder="Growth — https://drive.google.com/file/d/...&#10;https://t.me/channel/123&#10;https://youtu.be/xxxx"></textarea>
          <div><button class="uc2-btn p sm" id="linksAdd" type="button">إضافة الروابط</button></div>
        </div>

        <p class="uc2-note" id="target"></p>
        <div id="summary" hidden></div>
        <ul class="uc2-list" id="list"></ul>
        <p class="uc2-msg" id="msg" role="alert"></p>
      </div>
    </div>
  </main>
  <button class="uc2-fab" id="fab" type="button" hidden aria-live="polite"></button>
  <div class="uc2-ovl" id="ovl" hidden aria-hidden="true"><div>أفلت الملفات حتى تنرفع</div></div>
  <script src="js/api-client.js"></script>
  <script src="js/upload-center.js?v=2"></script>
</body>
</html>
