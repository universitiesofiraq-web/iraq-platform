<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>المنصة العراقية | ملازم وأسئلة جامعات العراق</title>
  <meta name="description" content="ابحث عن جامعتك أو كليتك أو قسمك، وحمّل الملازم والمحاضرات وأسئلة السنوات السابقة.">
  <meta name="theme-color" content="#0A1C4E">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/iq.css?v=3">
</head>
<body>
  <header class="iq-top">
    <a class="iq-brand" href="/"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="7" y="7" width="18" height="18" rx="2" fill="#E0A93B"/><rect x="7" y="7" width="18" height="18" rx="2" transform="rotate(45 16 16)" fill="#E0A93B"/><circle cx="16" cy="16" r="4" fill="#0A1C4E"/></svg><span>المنصة العراقية</span></a>
    <nav><a href="catalog.html">الجامعات</a><a href="contribute.html" data-upload-link hidden>رفع ملف</a><a class="iq-login" href="login.html">دخول</a></nav>
  </header>

  <section class="iq-hero">
    <div class="iq-hero-in">
      <h1>ابحث عن جامعتك أو كليتك أو قسمك</h1>
      <p class="sub">ملازم ومحاضرات وأسئلة سنوات سابقة لكل الجامعات العراقية، في مكان واحد.</p>
      <div class="iq-search" id="box" role="search">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label class="iq-sr" for="q">ابحث عن جامعة أو كلية أو قسم</label>
        <input id="q" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="اكتب مثلاً: طب الزهراء"
               role="combobox" aria-expanded="false" aria-controls="res" aria-autocomplete="list" autofocus>
        <button class="iq-clear" id="clr" type="button" aria-label="مسح البحث">✕</button>
        <div class="iq-res" id="res" role="listbox" aria-label="نتائج البحث" hidden></div>
      </div>
      <div class="iq-ex" id="ex" aria-label="أمثلة للبحث"></div>
      <div class="iq-stats" id="stats" aria-live="polite"></div>
    </div>
  </section>

  <main class="iq-main">
    <section class="iq-sec" aria-labelledby="allh">
      <h2 id="allh">كل الجامعات</h2>
      <p class="hint">أو اختر جامعتك من القائمة لتصل إلى كلياتها وأقسامها.</p>
      <div class="iq-grid" id="grid"><div class="cg-empty">جارٍ التحميل…</div></div>
    </section>
  </main>

  <footer class="iq-foot"><a href="privacy.html">الخصوصية</a><a href="terms.html">الشروط</a></footer>

  <script src="js/api-client.js"></script>
  <script>
  (function () {
    var $ = function (i) { return document.getElementById(i); };
    var KT = { gov: "حكومية", private: "أهلية" };
    var loadError = null;
    var DB = null, hits = [], cur = -1, KIND = { u: "جامعة", c: "كلية", d: "قسم" };

    function norm(s) {
      return String(s || "").toLowerCase()
        .replace(/[ً-ْـ]/g, "").replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه")
        .replace(/[^ء-يa-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
    }
    function words(s) { return norm(s).split(" ").filter(Boolean).map(function (w) { return w.length > 3 && w.indexOf("ال") === 0 ? w.slice(2) : w; }); }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

    function build(d) {
      var U = {}, C = {}, items = [];
      d.u.forEach(function (r) { U[r[0]] = { id: r[0], name: r[1], en: r[2] || "", city: r[3] || "", kind: r[4] || "" }; });
      d.c.forEach(function (r) { C[r[0]] = { id: r[0], u: r[1], name: r[2], en: r[3] || "" }; });
      Object.keys(U).forEach(function (k) {
        var u = U[k];
        items.push({ k: "u", id: u.id, title: u.name, path: [KT[u.kind], u.city || u.en].filter(Boolean).join(" · "), own: words(u.name + " " + u.en), all: words(u.name + " " + u.en + " " + u.city), href: "catalog.html?u=" + u.id + "&n=" + encodeURIComponent(u.name) });
      });
      d.c.forEach(function (r) {
        var c = C[r[0]], u = U[c.u]; if (!u) return;
        items.push({ k: "c", id: c.id, title: c.name, path: u.name, own: words(c.name + " " + c.en), all: words(c.name + " " + c.en + " " + u.name + " " + u.en + " " + u.city),
          href: "catalog.html?u=" + u.id + "&n=" + encodeURIComponent(u.name) + "&c=" + c.id + "&cn=" + encodeURIComponent(c.name) });
      });
      d.d.forEach(function (r) {
        var c = C[r[1]]; if (!c) return; var u = U[c.u]; if (!u) return;
        items.push({ k: "d", id: r[0], title: r[2], path: c.name + " · " + u.name, own: words(r[2]), all: words(r[2] + " " + c.name + " " + u.name + " " + u.en),
          href: "dept.html?id=" + r[0] });
      });
      return { U: U, items: items };
    }

    function match(tokens, hay, loose) {
      return tokens.every(function (t) {
        return hay.some(function (w) { return loose ? w.indexOf(t) >= 0 : w.indexOf(t) === 0; });
      });
    }
    function score(tokens, it) {
      var s = 0;
      tokens.forEach(function (t) { if (it.own.some(function (w) { return w.indexOf(t) === 0; })) s += 3; else s += 1; });
      s += { u: 0.6, c: 0.4, d: 0 }[it.k];
      return s - it.title.length / 400;
    }
    function find(q) {
      var tokens = words(q); if (!tokens.length) return [];
      var out = DB.items.filter(function (it) { return match(tokens, it.all, false); });
      if (!out.length) out = DB.items.filter(function (it) { return match(tokens, it.all, true); });
      return out.map(function (it) { return { it: it, s: score(tokens, it) }; })
        .sort(function (a, b) { return b.s - a.s; }).slice(0, 12).map(function (x) { return x.it; });
    }
    function mark(text, tokens) {
      return text.split(/(\s+|·)/).map(function (w) {
        var n = words(w)[0];
        return n && tokens.some(function (t) { return n.indexOf(t) === 0; }) ? "<mark>" + esc(w) + "</mark>" : esc(w);
      }).join("");
    }

    function show(list, q) {
      var r = $("res"), tokens = words(q); r.innerHTML = ""; cur = -1; hits = list;
      if (!list.length) { r.innerHTML = '<div class="iq-none">لا توجد نتائج لـ «' + esc(q) + '». جرّب كلمة أقصر أو اسم الجامعة فقط.</div>'; }
      list.forEach(function (it, i) {
        var a = document.createElement("a");
        a.className = "iq-hit"; a.href = it.href; a.id = "hit" + i; a.setAttribute("role", "option"); a.setAttribute("aria-selected", "false");
        a.innerHTML = '<span class="iq-kind">' + KIND[it.k] + '</span><span><span class="t">' + mark(it.title, tokens) + '</span>' +
          (it.path ? '<span class="p">' + mark(it.path, tokens) + '</span>' : "") + "</span>";
        r.appendChild(a);
      });
      r.hidden = false; $("q").setAttribute("aria-expanded", "true");
    }
    function hide() { $("res").hidden = true; $("q").setAttribute("aria-expanded", "false"); $("q").removeAttribute("aria-activedescendant"); }
    function run() {
      var v = $("q").value; $("box").classList.toggle("has", !!v);
      if (!v.trim()) return hide();
      if (!DB) {
        var result = $("res");
        result.replaceChildren();
        var notice = document.createElement("div"); notice.className = "iq-none";
        notice.textContent = loadError ? IQApi.errorText(loadError) : "جارٍ تحميل دليل البحث…";
        result.appendChild(notice); result.hidden = false;
        $("q").setAttribute("aria-expanded", "true");
        return;
      }
      show(find(v), v.trim());
    }
    function move(d) {
      var links = $("res").querySelectorAll(".iq-hit"); if (!links.length) return;
      cur = (cur + d + links.length) % links.length;
      links.forEach(function (l, i) { l.setAttribute("aria-selected", i === cur ? "true" : "false"); });
      $("q").setAttribute("aria-activedescendant", links[cur].id); links[cur].scrollIntoView({ block: "nearest" });
    }

    $("q").addEventListener("input", run);
    $("q").addEventListener("focus", run);
    $("q").addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
      else if (e.key === "Escape") hide();
      else if (e.key === "Enter" && hits.length) { e.preventDefault(); location.href = hits[cur < 0 ? 0 : cur].href; }
    });
    $("clr").addEventListener("click", function () { $("q").value = ""; run(); $("q").focus(); });
    document.addEventListener("click", function (e) { if (!e.target.closest("#box")) hide(); });

    try { // قسمك الأخير: متابعة بنقرة واحدة
      var sv = JSON.parse(localStorage.getItem("iq.dept") || "null");
      if (sv && Number(sv.id) > 0) {
        var mine = document.createElement("button"); mine.type = "button"; mine.hidden = true; mine.textContent = "متابعة إلى: " + sv.name;
        mine.onclick = function () { location.href = "dept.html?id=" + Number(sv.id); };
        $("ex").appendChild(mine);
      }
    } catch (e) { /* لا شيء */ }
    ["طب الزهراء", "هندسة بغداد", "صيدلة الموصل"].forEach(function (t) {
      var b = document.createElement("button"); b.type = "button"; b.textContent = t;
      b.onclick = function () { $("q").value = t; $("q").focus(); run(); };
      $("ex").appendChild(b);
    });

    function loadIndex() {
    loadError = null;
    $("grid").textContent = "جارٍ التحميل…";
    IQApi.request("/api/catalog/index").then(function (d) {
      DB = build(d);
      if (mine && sv) {
        var saved = d.d.find(function (row) { return row[0] === Number(sv.id); });
        mine.hidden = !saved;
        if (saved) mine.textContent = "متابعة إلى: " + saved[2];
      }
      $("stats").textContent = d.u.length + " جامعة · " + d.c.length + " كلية" + (d.d.length ? " · " + d.d.length + " قسم" : "");
      var g = $("grid"); g.innerHTML = "";
      if (!d.u.length) g.textContent = "لا توجد جامعات مفعّلة حاليًا.";
      d.u.slice().sort(function (a, b) { return a[1].localeCompare(b[1], "ar"); }).forEach(function (r) {
        var a = document.createElement("a"); a.className = "iq-u"; a.href = "catalog.html?u=" + r[0] + "&n=" + encodeURIComponent(r[1]);
        var b = document.createElement("b"); b.textContent = r[1]; a.appendChild(b);
        var sub = [KT[r[4]], r[3] || r[2]].filter(Boolean).join(" · ");
        if (sub) { var s = document.createElement("small"); s.textContent = sub; a.appendChild(s); }
        g.appendChild(a);
      });
      run();
    }).catch(function (error) {
      loadError = error;
      IQApi.showError($("grid"), error, loadIndex);
      run();
    });
    }
    loadIndex();
  })();
  </script>
  <script src="js/upload-link.js"></script>
</body>
</html>
