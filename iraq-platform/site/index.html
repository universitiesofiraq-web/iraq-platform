<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>المنصة العراقية | ملازم وأسئلة جامعات العراق</title>
  <meta name="description" content="ملازم ومحاضرات وأسئلة سنوات سابقة لطلبة جميع الجامعات والكليات العراقية.">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <meta name="theme-color" content="#13294B">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,Tahoma,sans-serif;background:#f4f7fb;color:#13294B;min-height:100vh}
    .top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
    .top b{font-size:1.1rem}
    .top a{color:#13294B;text-decoration:none;font-size:.9rem;border:1px solid #13294B55;padding:6px 12px;border-radius:8px}
    .hero{max-width:640px;margin:7vh auto 0;padding:0 18px;text-align:center}
    .hero h1{font-size:2rem;margin:0 0 8px}
    .hero p{margin:0 0 24px;opacity:.75}
    .box{position:relative;text-align:right}
    .box input{width:100%;padding:16px 18px;font:inherit;font-size:1.05rem;border-radius:14px;border:2px solid #13294B33;background:#fff;color:inherit}
    .box input:focus{outline:none;border-color:#2b6cb0}
    .res{position:absolute;inset-inline:0;top:100%;margin-top:6px;background:#fff;border-radius:14px;box-shadow:0 8px 28px #0002;max-height:55vh;overflow:auto;z-index:5}
    .res a{display:flex;justify-content:space-between;gap:10px;padding:13px 18px;color:inherit;text-decoration:none;border-bottom:1px solid #0001}
    .res a:hover,.res a.on{background:#eaf2fb}
    .res small{opacity:.6}
    .res .none{padding:16px;text-align:center;opacity:.6}
    .all{display:inline-block;margin-top:22px;padding:12px 22px;border-radius:12px;background:#13294B;color:#fff;text-decoration:none}
    .stats{margin-top:30px;opacity:.6;font-size:.9rem}
  </style>
</head>
<body>
  <div class="top"><b>المنصة العراقية</b><a href="login.html">تسجيل الدخول</a></div>
  <main class="hero">
    <h1>ابحث عن جامعتك</h1>
    <p>ملازم ومحاضرات وأسئلة سنوات سابقة لكل الجامعات والكليات العراقية</p>
    <div class="box">
      <input id="q" type="search" placeholder="اكتب اسم الجامعة أو المدينة…" autocomplete="off" autofocus>
      <div class="res" id="res" hidden></div>
    </div>
    <a class="all" href="catalog.html">تصفح كل الجامعات</a>
    <div class="stats" id="stats"></div>
  </main>
  <script>
  (function () {
    var $ = function (i) { return document.getElementById(i); };
    var items = [], cur = -1;
    function norm(s) {
      return String(s || "").toLowerCase()
        .replace(/[ً-ْـ]/g, "").replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه");
    }
    function render(list) {
      var r = $("res"); r.innerHTML = ""; cur = -1;
      if (!list.length) { var n = document.createElement("div"); n.className = "none"; n.textContent = "لا توجد نتائج"; r.appendChild(n); r.hidden = false; return; }
      list.slice(0, 30).forEach(function (u) {
        var a = document.createElement("a");
        a.href = "catalog.html?u=" + u.id + "&n=" + encodeURIComponent(u.name_ar);
        var s = document.createElement("span"); s.textContent = u.name_ar; a.appendChild(s);
        var sub = u.city || u.name_en;
        if (sub) { var m = document.createElement("small"); m.textContent = sub; a.appendChild(m); }
        r.appendChild(a);
      });
      r.hidden = false;
    }
    function search() {
      var q = norm($("q").value.trim());
      if (!q) { $("res").hidden = true; return; }
      render(items.filter(function (u) { return norm(u.name_ar + " " + (u.name_en || "") + " " + (u.city || "")).indexOf(q) >= 0; }));
    }
    $("q").addEventListener("input", search);
    $("q").addEventListener("focus", search);
    $("q").addEventListener("keydown", function (e) {
      var links = $("res").querySelectorAll("a");
      if (!links.length) return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        cur = (cur + (e.key === "ArrowDown" ? 1 : -1) + links.length) % links.length;
        links.forEach(function (l, i) { l.className = i === cur ? "on" : ""; });
      } else if (e.key === "Enter") { location.href = links[cur < 0 ? 0 : cur].href; }
    });
    document.addEventListener("click", function (e) { if (!e.target.closest(".box")) $("res").hidden = true; });
    fetch("/api/catalog/universities").then(function (r) { return r.json(); }).then(function (d) {
      items = d.items || [];
      $("stats").textContent = items.length ? items.length + " جامعة ومؤسسة تعليمية" : "";
    }).catch(function () {});
  })();
  </script>
</body>
</html>
