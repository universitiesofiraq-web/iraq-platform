<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#102a3d">
  <title>لوحة الإدارة | منصة الجامعات العراقية</title>
  <link rel="icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin-v3.css?v=1">
  <script type="module" src="js/admin-v3.js?v=1"></script>
</head>
<body>
  <a class="skip" href="#main">انتقل إلى المحتوى</a>
  <div class="layout">
    <aside class="sidebar" aria-label="القائمة الإدارية">
      <a class="brand" href="index.html">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 12 16 5l11 7M7 13h18M9 14v11m7-11v11m7-11v11M5 26h22"/></svg>
        <span><strong>منصة الجامعات العراقية</strong><small>مساحة الإدارة</small></span>
      </a>
      <button id="nav-toggle" type="button" aria-expanded="false" aria-controls="sidebar-nav">القائمة الإدارية</button>
      <nav id="sidebar-nav" hidden></nav>
      <div class="sidebar-account" id="sidebar-account" hidden>
        <strong id="role"></strong>
        <small id="scope-label"></small>
      </div>
    </aside>
    <div class="surface">
      <header class="topbar">
        <label class="quick-search" id="search-box" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg>
          <input id="search" type="search" placeholder="ابحث باسم الجامعة أو المحافظة" aria-label="ابحث باسم الجامعة أو المحافظة">
        </label>
        <div class="top-actions">
          <button id="theme" type="button" aria-pressed="false">الوضع الداكن</button>
          <span id="account" class="account" hidden></span>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <div class="heading">
          <div>
            <p class="eyebrow" id="breadcrumb">الرئيسية / الإدارة</p>
            <h1 id="title">لوحة الإدارة</h1>
            <p class="muted" id="description"></p>
          </div>
          <div class="actions" id="page-actions"></div>
        </div>
        <p class="notice" id="notice" role="status" aria-live="polite">جارٍ التحقق من الحساب…</p>
        <div id="content" hidden></div>
      </main>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <form id="dialog-form">
      <h2 id="dialog-title"></h2>
      <p class="muted" id="dialog-message"></p>
      <div id="dialog-fields"></div>
      <p id="dialog-error" role="alert"></p>
      <div class="actions">
        <button class="primary" type="submit" id="dialog-confirm">تأكيد</button>
        <button type="button" id="dialog-close">إلغاء</button>
      </div>
    </form>
  </dialog>
</body>
</html>
