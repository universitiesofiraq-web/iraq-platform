<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"><script src="js/theme.js?v=3"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <meta name="robots" content="noindex, nofollow">
  <title>التبليغات | دفعتنا</title>
  <link rel="icon" type="image/png" href="assets/favicon-48.png">
  <meta name="theme-color" content="#0A1C4E">
  <link rel="stylesheet" href="css/style.css?v=ds1">
  <link rel="stylesheet" href="css/upload.css?v=p3-23"><link rel="stylesheet" href="css/dfa.css?v=6">
  <script>
  </script>
</head>
<body>
  <header class="iq-top"><a class="iq-brand" href="index.html"><img class="dfa-mark" src="assets/brand.svg" width="32" height="32" alt=""><span>دفعتنا</span></a><nav><a href="admin.html">الإدارة</a><a class="iq-login" href="login.html">حسابي</a></nav></header>
  <main class="container up-main" id="main">
    <h1 class="up-title">التبليغات</h1>
    <p class="up-lead">تبليغ عام يظهر لكل الطلاب في الصفحة الرئيسية. للمشرف العام فقط.</p>
    <p class="up-msg" id="msg" role="alert" hidden></p>

    <section class="card up-card" aria-label="تبليغ جديد" id="formCard" hidden>
      <h2 class="up-sub">تبليغ جديد</h2>
      <form class="up-form" id="form" autocomplete="off" novalidate>
        <div>
          <label class="up-label" for="title">العنوان</label>
          <input class="field" id="title" type="text" maxlength="120" required>
        </div>
        <div>
          <label class="up-label" for="body">النص (اختياري)</label>
          <textarea class="field" id="body" rows="5" maxlength="2000"></textarea>
        </div>
        <div class="up-actions"><button class="btn btn-primary" type="submit" id="send">نشر التبليغ</button></div>
      </form>
    </section>

    <section class="card up-card" aria-label="التبليغات المنشورة" id="listCard" hidden>
      <h2 class="up-sub">المنشورة الآن</h2>
      <div id="list"></div>
    </section>
  </main>
  <script src="js/auth.js?v=p3-23"></script>
  <script src="js/announce.js?v=ui2"></script>
</body>
</html>
