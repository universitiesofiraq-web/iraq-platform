<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>القسم | المنصة العراقية</title>
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <meta name="theme-color" content="#13294B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/iq.css?v=1">
  <style>
    .dp-tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
    .dp-tools a,.dp-tools button{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line,#2a3a6a);background:transparent;color:inherit;font:inherit;text-decoration:none;display:inline-flex;align-items:center;cursor:pointer}
    .dp-files{display:grid;gap:6px;margin:4px 0 10px;padding-inline-start:12px}
    .dp-files a{display:block;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.05);color:inherit;text-decoration:none;font-size:.95rem}
    .dp-none{padding:6px 14px;opacity:.6;font-size:.9rem}
    .dp-term{margin:18px 0 6px;font-weight:600;color:#E0A93B}
    .dp-count{font-size:.85rem;opacity:.75}
    .dp-add{display:none;gap:8px;grid-template-columns:1fr 1fr;margin:12px 0;max-width:560px}
    .dp-add.on{display:grid}
    .dp-add input,.dp-add select{min-height:44px;width:100%}
    .dp-add input.wide{grid-column:1/-1}
    .dp-add button{grid-column:1/-1}
  </style>
</head>
<body>
  <header class="iq-top">
    <a class="iq-brand" href="/"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="7" y="7" width="18" height="18" rx="2" fill="#E0A93B"/><rect x="7" y="7" width="18" height="18" rx="2" transform="rotate(45 16 16)" fill="#E0A93B"/><circle cx="16" cy="16" r="4" fill="#0A1C4E"/></svg><span>المنصة العراقية</span></a>
    <nav><a href="catalog.html">الجامعات</a><a class="iq-login" href="login.html">دخول</a></nav>
  </header>
  <main class="sj">
    <div class="sj-top"><a id="back" href="catalog.html">← رجوع</a></div>
    <div class="crumb" id="crumb"></div>
    <h1 id="title">…</h1>
    <div class="dp-tools" id="tools"></div>
    <form class="dp-add" id="addf">
      <input class="wide" id="nm" maxlength="120" placeholder="اسم المادة" required>
      <select id="st"></select>
      <select id="tm"><option value="1">الكورس الأول</option><option value="2">الكورس الثاني</option></select>
      <input class="wide" id="pf" maxlength="120" placeholder="اسم التدريسي (اختياري)">
      <button class="btn btn-primary" type="submit">إضافة المادة</button>
    </form>
    <p class="ct-msg" id="msg" role="alert"></p>
    <div id="subs"><div class="sj-empty">جارٍ التحميل…</div></div>
  </main>
  <script>
  (function () {
    var $ = function (i) { return document.getElementById(i); };
    var id = Number(new URLSearchParams(location.search).get("id"));
    var ORD = { "الأولى": 1, "الثانية": 2, "الثالثة": 3, "الرابعة": 4, "الخامسة": 5, "السادسة": 6 };
    var info = null, can = false, counts = {}, files = {}, TYPE = { lecture: "محاضرة", quiz: "اختبار", exam: "أسئلة سنوات" };

    function el(tag, text, cls) { var e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }
    function msg(t, ok) { var m = $("msg"); m.textContent = t; m.style.color = ok ? "#2f855a" : "#c53030"; }
    function stageOfName(n) { var m = /المرحلة\s+(\S+)/.exec(n || ""); return m && ORD[m[1]] ? ORD[m[1]] : 0; }

    function render(items) {
      var box = $("subs"); box.innerHTML = "";
      if (!items.length) {
        box.appendChild(el("div", can ? "لا توجد مواد بعد. أضف أول مادة من زر «إضافة مادة»." : "لم تُضف مواد لهذا القسم بعد. يمكن لممثل القسم إضافتها.", "sj-empty"));
        return;
      }
      var groups = {};
      items.forEach(function (s) { var k = s.stage + "-" + s.term; (groups[k] = groups[k] || []).push(s); });
      Object.keys(groups).sort(function (a, b) { var x = a.split("-"), y = b.split("-"); return x[0] - y[0] || x[1] - y[1]; }).forEach(function (k) {
        var p = k.split("-");
        box.appendChild(el("div", "المرحلة " + p[0] + " — الكورس " + p[1], "dp-term"));
        groups[k].forEach(function (s) {
          var a = el("a", null, "sj-item"); a.href = "subject.html?id=" + s.id; a.style.textDecoration = "none"; a.style.color = "inherit";
          var l = el("div"); l.appendChild(el("b", s.name_ar));
          if (s.professor) l.appendChild(el("small", " " + s.professor));
          a.appendChild(l);
          a.appendChild(el("span", (counts[s.id] || 0) + " ملف", "dp-count"));
          box.appendChild(a);
          var ul = el("div", null, "dp-files"), fl = (files[s.id] || []).slice().sort(function (x, y) { return (x.type > y.type ? 1 : x.type < y.type ? -1 : 0) || (x.number - y.number); });
          if (!fl.length) ul.appendChild(el("div", "لا توجد ملفات بعد.", "dp-none"));
          fl.forEach(function (f) {
            var fa = el("a", (f.number ? "المحاضرة " + f.number + (f.title ? " — " + f.title : "") + " · " : TYPE[f.type] + " · ") + f.label);
            fa.href = f.kind === "link" ? f.url : "/api/file/" + f.id; fa.target = "_blank"; fa.rel = "noopener";
            ul.appendChild(fa);
          });
          box.appendChild(ul);
        });
      });
    }

    function loadSubjects() {
      fetch("/api/catalog/subjects?department_id=" + id).then(function (r) { return r.json(); }).then(function (d) { render(d.items || []); })
        .catch(function () { $("subs").innerHTML = '<div class="sj-empty">تعذّر التحميل.</div>'; });
    }

    $("addf").onsubmit = function (e) {
      e.preventDefault();
      fetch("/api/catalog/add", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ type: "subject", department_id: id, name_ar: $("nm").value, stage: Number($("st").value), term: Number($("tm").value), professor: $("pf").value }) })
        .then(function (r) { return r.json(); }).then(function (d) {
          if (d.ok) { msg("تمت إضافة المادة.", true); $("nm").value = ""; $("pf").value = ""; loadSubjects(); } else msg("تعذّرت الإضافة.");
        });
    };

    fetch("/api/catalog/department?id=" + id).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) { $("title").textContent = "القسم غير موجود"; $("subs").innerHTML = ""; return; }
      info = d.item; can = !!d.can;
      $("title").textContent = info.name_ar;
      $("crumb").textContent = info.university + " / " + info.college;
      document.title = info.name_ar + " | المنصة العراقية";
      try { localStorage.setItem("iq.dept", JSON.stringify({ id: id, name: info.name_ar + " — " + info.college })); } catch (e) { /* لا شيء */ }
      fetch("/api/sync", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ items: { "iq.dept": { t: Date.now(), v: { id: id, name: info.name_ar + " — " + info.college } } } }) }).catch(function () {}); // حفظ في الحساب إن كان مسجّلاً
      $("back").href = "catalog.html?u=" + info.university_id + "&n=" + encodeURIComponent(info.university) + "&c=" + info.college_id + "&cn=" + encodeURIComponent(info.college);
      var tools = $("tools");
      fetch("/api/auth/me").then(function (r) { return r.json(); }).then(function (m) { // زر الرفع لمن يملك صلاحيته فقط
        var u = m && m.user;
        if (u && (u.admin || (u.scopes || []).length || u.role === "uploader" || u.role === "rep")) { var up = el("a", "رفع ملف"); up.href = "contribute.html"; tools.insertBefore(up, tools.firstChild); }
      }).catch(function () {});
      if (can) {
        var add = el("button", "إضافة مادة"); add.type = "button"; add.onclick = function () { $("addf").classList.toggle("on"); }; tools.appendChild(add);
        var tm = el("a", "إدارة الفريق"); tm.href = "team.html"; tools.appendChild(tm);
        var fixed = stageOfName(info.name_ar), st = $("st");
        for (var i = 1; i <= 8; i++) if (!fixed || i === fixed) st.appendChild(new Option("المرحلة " + i, i));
      }
      fetch("/api/uploads").then(function (r) { return r.json(); }).then(function (u) {
        (u.items || []).forEach(function (x) { var m = /^s(\d+)$/.exec(x.courseId || ""); if (m) { counts[m[1]] = (counts[m[1]] || 0) + 1; (files[m[1]] = files[m[1]] || []).push(x); } });
      }).catch(function () {}).then(loadSubjects);
    }).catch(function () { $("title").textContent = "تعذّر التحميل"; });
  })();
  </script>
</body>
</html>
