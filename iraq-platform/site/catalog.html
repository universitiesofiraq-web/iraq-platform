<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"><script src="js/theme.js?v=3"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <title>الجامعات والكليات | دفعتنا</title>
  <link rel="icon" type="image/png" href="assets/favicon-48.png">
  <meta name="theme-color" content="#0A1C4E">
  <link rel="stylesheet" href="css/iq.css?v=ds1"><link rel="stylesheet" href="css/dfa.css?v=7">
</head>
<body>
  <header class="iq-top">
    <a class="iq-brand" href="/"><img class="dfa-mark" src="assets/brand.svg" width="32" height="32" alt=""><span>دفعتنا</span></a>
    <nav><a href="search.html">بحث</a><a href="catalog.html">الجامعات</a><a href="contribute.html" data-upload-link hidden>رفع ملف</a><a class="iq-login" href="login.html">دخول</a></nav>
  </header>
  <main class="cg">
    <div class="campus-banner"><h1 id="title">اختر جامعتك</h1></div>
    <nav class="cg-path" id="path" aria-label="المسار"></nav>
    <input id="qf" type="search" class="cg-q" placeholder="ابحث عن جامعة أو كلية أو قسم…" aria-label="بحث في القائمة" autocomplete="off">
    <div class="cg-list" id="list"></div>
    <p class="cg-empty" id="joinHint" hidden>جامعتك غير موجودة في القائمة؟ <a href="join.html">سجّل جامعتك من كل جامعات العراق</a></p>
    <form class="cg-add" id="add" hidden>
      <strong id="addTitle"></strong>
      <input aria-label="الاسم بالعربية" id="fName" placeholder="الاسم بالعربية" required maxlength="120">
      <input aria-label="الاسم بالإنجليزية (اختياري)" id="fEn" placeholder="الاسم بالإنجليزية (اختياري)" maxlength="120">
      <div class="cg-row" id="subExtra" hidden>
        <select id="fStage" aria-label="المرحلة"></select><select id="fTerm" aria-label="الكورس"></select>
      </div>
      <input aria-label="اسم الأستاذ (اختياري)" id="fProf" placeholder="اسم الأستاذ (اختياري)" maxlength="120" hidden>
      <button class="btn btn-primary" type="submit">إضافة</button>
      <div class="cg-msg" id="msg" role="alert"></div>
    </form>
  </main>
  <script src="js/api-client.js"></script>
  <script>
  (function () {
    var LV = ["university", "college", "department", "subject"];
    var API = { university: "universities", college: "colleges", department: "departments", subject: "subjects" };
    var TITLES = ["اختر جامعتك", "اختر الكلية", "اختر القسم", "المواد الدراسية"];
    var PARENT = { college: "university_id", department: "college_id", subject: "department_id" };
    var ADDT = ["إضافة جامعة", "إضافة كلية", "إضافة قسم", "إضافة مادة"];
    var stack = [];     // [{type,id,name}] العناصر المختارة
    var admin = false;
    var loadVersion = 0;
    var $ = function (i) { return document.getElementById(i); };

    function fillSelect(sel, n, label) {
      sel.innerHTML = "";
      for (var i = 1; i <= n; i++) { var o = document.createElement("option"); o.value = i; o.textContent = label + " " + i; sel.appendChild(o); }
    }
    fillSelect($("fStage"), 8, "المرحلة"); fillSelect($("fTerm"), 2, "الكورس");

    function api(p, body) {
      return IQApi.request("/api/catalog/" + p, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
    }
    function level() { return stack.length; }
    function norm(s) { return String(s || "").toLowerCase().replace(/[ً-ْـ]/g, "").replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه"); }
    var INDEX = null, indexReq = null, searchVersion = 0;
    function loadIndex() {
      if (INDEX) return Promise.resolve(INDEX);
      return indexReq || (indexReq = api("index").then(function (d) { return (INDEX = d); }).catch(function () { indexReq = null; return null; }));
    }
    function clearHits() { var h = $("hits"); if (h) h.remove(); }
    function showHits(q, version) {
      loadIndex().then(function (d) {
        if (!d || version !== searchVersion || level() !== 0) return;
        var U = {}, C = {}, out = [];
        (d.u || []).forEach(function (r) { U[r[0]] = r; });
        (d.c || []).forEach(function (r) { C[r[0]] = r; });
        (d.d || []).forEach(function (r) {
          var c = C[r[1]], u = c && U[c[1]];
          if (u && norm(r[2] + " " + c[2]).indexOf(q) >= 0) out.push({ u: u, c: c, d: r });
        });
        clearHits();
        if (!out.length) return;
        var box = document.createElement("div"); box.id = "hits";
        var h = document.createElement("h3"); h.textContent = "أقسام مطابقة"; box.appendChild(h);
        out.slice(0, 20).forEach(function (o) {
          var row = document.createElement("div"); row.className = "cg-item";
          var n = document.createElement("span"); n.textContent = o.d[2]; row.appendChild(n);
          var sm = document.createElement("small"); sm.textContent = o.u[1] + " · " + o.c[2]; row.appendChild(sm);
          row.onclick = function () { location.href = "dept.html?id=" + o.d[0]; };
          box.appendChild(row);
        });
        $("list").after(box);
      });
    }
    $("qf").addEventListener("input", function () {
      var q = norm(this.value.trim());
      document.querySelectorAll("#list .cg-item").forEach(function (r) { r.style.display = !q || (r.dataset.t || "").indexOf(q) >= 0 ? "" : "none"; });
      var v = ++searchVersion; clearHits();
      if (q.length >= 2 && level() === 0) showHits(q, v);
    });
    var P = new URLSearchParams(location.search);
    if (Number(P.get("u"))) {
      stack = [{ type: "university", id: Number(P.get("u")), name: P.get("n") || "الجامعة" }];
      if (Number(P.get("c"))) stack.push({ type: "college", id: Number(P.get("c")), name: P.get("cn") || "الكلية" });
      if (stack.length === 2 && Number(P.get("d"))) stack.push({ type: "department", id: Number(P.get("d")), name: P.get("dn") || "القسم" });
    }

    function renderPath() {
      var p = $("path"); p.innerHTML = "";
      var root = document.createElement("button"); root.textContent = "الجامعات"; root.onclick = function () { stack = []; load(); }; p.appendChild(root);
      stack.forEach(function (s, i) {
        p.appendChild(document.createTextNode(" / "));
        var b = document.createElement("button"); b.textContent = s.name;
        b.onclick = function () { stack = stack.slice(0, i + 1); load(); }; p.appendChild(b);
      });
    }

    function load() {
      var request = ++loadVersion;
      $("add").hidden = true;
      var lv = level();
      $("title").textContent = TITLES[lv]; $("qf").value = ""; searchVersion++; clearHits();
      renderPath();
      $("joinHint").hidden = lv !== 0;
      var type = LV[lv];
      var qs = lv ? "?" + PARENT[type] + "=" + stack[lv - 1].id : "";
      $("list").innerHTML = '<div class="cg-empty">جارٍ التحميل…</div>';
      api(API[type] + qs).then(function (d) {
        if (request !== loadVersion) return;
        var list = $("list"); list.innerHTML = "";
        var items = (d && d.items) || [];
        if (!items.length) { list.innerHTML = '<div class="cg-empty">لا توجد عناصر بعد.</div>'; }
        var lastGroup = "";
        items.forEach(function (it) {
          if (type === "subject") {
            var g = "المرحلة " + it.stage + " — الكورس " + it.term;
            if (g !== lastGroup) { var h = document.createElement("h3"); h.textContent = g; list.appendChild(h); lastGroup = g; }
          }
          var row = document.createElement("div"); row.className = "cg-item";
          var name = document.createElement("span"); name.textContent = it.name_ar;
          if (type === "college" || type === "university") { var lg = document.createElement("img"); lg.className = "uc-logo-img"; lg.alt = ""; lg.loading = "lazy"; lg.src = "/api/" + type + "-logo/" + it.id; lg.onerror = function () { lg.remove(); }; row.appendChild(lg); }
          row.appendChild(name);
          var sub = it.professor || it.city || it.name_en;
          if (sub) { var s = document.createElement("small"); s.textContent = sub; row.appendChild(s); }
          if (admin) {
            var del = document.createElement("button"); del.className = "btn btn-secondary btn-sm"; del.textContent = "حذف";
            del.onclick = function (e) {
              e.stopPropagation();
              if (!confirm("حذف «" + it.name_ar + "»؟")) return;
              api("delete", { type: type, id: it.id }).then(function (r) { if (r.ok) load(); else alert("تعذّر الحذف"); }).catch(function (error) { alert(error.code === "not_empty" ? "احذف محتوياته أولاً" : IQApi.errorText(error)); });
            };
            row.appendChild(del);
          }
          if (type === "department") row.onclick = function () { location.href = "dept.html?id=" + it.id; };
          else if (type !== "subject") row.onclick = function () { stack.push({ type: type, id: it.id, name: it.name_ar }); load(); };
          else row.onclick = function () { location.href = "subject.html?id=" + it.id; };
          row.dataset.t = norm(it.name_ar + " " + (it.name_en || "") + " " + (it.city || ""));
          list.appendChild(row);
        });
        var f = $("add"); f.hidden = !admin;
        $("addTitle").textContent = ADDT[lv];
        $("subExtra").hidden = type !== "subject"; $("fProf").hidden = type !== "subject";
        $("msg").textContent = "";
      }).catch(function (error) {
        if (request === loadVersion) IQApi.showError($("list"), error, load);
      });
    }

    $("add").onsubmit = function (e) {
      e.preventDefault();
      var type = LV[level()];
      var body = { type: type, name_ar: $("fName").value, name_en: $("fEn").value };
      if (level()) body[PARENT[type]] = stack[level() - 1].id;
      if (type === "subject") { body.stage = $("fStage").value; body.term = $("fTerm").value; body.professor = $("fProf").value; }
      api("add", body).then(function (r) {
        if (r.ok) { $("fName").value = ""; $("fEn").value = ""; $("fProf").value = ""; load(); }
        else $("msg").textContent = "تعذّرت الإضافة";
      }).catch(function (error) { $("msg").textContent = IQApi.errorText(error); });
    };

    IQApi.request("/api/auth/me").then(function (d) {
      var u = d && (d.user || d);
      admin = !!(u && u.admin);
    }).catch(function () {}).then(load);
  })();
  </script>
  <script src="js/upload-link.js?v=2"></script>
</body>
</html>
