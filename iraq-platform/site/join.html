<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سجّل جامعتك | دفعتنا</title>
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <meta name="theme-color" content="#0A1C4E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/iq.css?v=11"><link rel="stylesheet" href="css/dfa.css?v=3">
  <style>
    .jn-steps{display:flex;gap:6px;margin:4px 0 14px;flex-wrap:wrap}
    .jn-steps span{flex:1;min-width:64px;text-align:center;padding:8px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;color:var(--ink2)}
    .jn-steps span.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
    .jn-steps span.done{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
    .jn-steps span.done::before{content:"\2713\00a0"}
    .jn-stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
    .jn-stages button{min-height:56px;padding:14px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
    .jn-stages button:hover{border-color:var(--accent)}
    .jn-lead{color:var(--ink2);margin:-4px 0 12px}
    .jn-hit small{display:block;color:var(--ink2);font-size:.82rem}
    .jn-sep{margin:14px 0 6px;font-size:.85rem;color:var(--ink2);font-weight:600}
    .jn-done{text-align:center;padding:28px 8px}
    .jn-done b{display:block;font-size:1.2rem;margin-bottom:8px}
  </style>
</head>
<body>
  <header class="iq-top">
    <a class="iq-brand" href="/"><img class="dfa-mark" src="assets/brand.svg" width="32" height="32" alt=""><span>دفعتنا</span></a>
    <nav><a href="catalog.html">الجامعات</a><a class="iq-login" href="login.html">دخول</a></nav>
  </header>
  <main class="cg">
    <h1 id="title">سجّل جامعتك</h1>
    <p class="jn-lead" id="lead">اختر جامعتك ثم كليتك وقسمك ومرحلتك، وتدخل مباشرة إلى مواد قسمك.</p>
    <div class="jn-steps" id="steps"><span>الجامعة</span><span>الكلية</span><span>القسم</span><span>المرحلة</span></div>
    <nav class="cg-path" id="path" aria-label="المسار"></nav>
    <input id="qf" type="search" class="cg-q" placeholder="ابحث عن جامعتك أو قسمك…" aria-label="بحث" autocomplete="off">
    <div class="cg-list" id="list"></div>
    <div class="cg-msg" id="msg" role="alert"></div>
  </main>
  <script src="js/api-client.js"></script>
  <script>
  (function () {
    var $ = function (i) { return document.getElementById(i); };
    var TITLES = ["اختر جامعتك", "اختر كليتك", "اختر قسمك", "اختر مرحلتك"];
    var stack = []; // [{id,name}] جامعة، كلية، قسم
    var INV = (new URLSearchParams(location.search).get("inv") || "").toUpperCase();
    var loadVersion = 0;
    var INFO = null; // معلومات رابط الدعوة إن وُجد
    function loginUrl() { return "login.html?next=" + encodeURIComponent("join.html" + location.search); }
    var STAGE_NAMES = ["الأولى", "الثانية", "الثالثة", "الرابعة", "الخامسة", "السادسة", "السابعة", "الثامنة"];
    function norm(s) { return String(s || "").toLowerCase().replace(/[ً-ْـ]/g, "").replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه"); }
    function get(p) { return IQApi.request("/api/catalog/" + p, { credentials: "same-origin" }); }

    var INDEX = null, indexReq = null;
    function loadIndex() {
      if (INDEX) return Promise.resolve(INDEX);
      return indexReq || (indexReq = get("index?view=join").then(function (d) { return (INDEX = d); }).catch(function () { indexReq = null; return null; }));
    }
    function clearHits() { var h = $("hits"); if (h) h.remove(); }
    function showHits(q, version) {
      loadIndex().then(function (d) {
        if (!d || version !== searchVersion || stack.length !== 0) return;
        var U = {}, C = {}, out = [];
        (d.u || []).forEach(function (r) { U[r[0]] = r; });
        (d.c || []).forEach(function (r) { C[r[0]] = r; });
        (d.d || []).forEach(function (r) {
          var c = C[r[1]], u = c && U[c[1]]; if (!u) return;
          if (norm(r[2] + " " + c[2]).indexOf(q) < 0) return;
          out.push({ u: u, c: c, d: r });
        });
        clearHits();
        if (!out.length) return;
        var box = document.createElement("div"); box.id = "hits";
        var h = document.createElement("div"); h.className = "jn-sep"; h.textContent = "أقسام مطابقة";
        box.appendChild(h);
        out.slice(0, 20).forEach(function (o) {
          var row = document.createElement("div"); row.className = "cg-item jn-hit";
          var n = document.createElement("span"); n.textContent = o.d[2]; row.appendChild(n);
          var s = document.createElement("small"); s.textContent = o.u[1] + " · " + o.c[2]; row.appendChild(s);
          row.onclick = function () {
            stack = [{ id: o.u[0], name: o.u[1] }, { id: o.c[0], name: o.c[2] }, { id: o.d[0], name: o.d[2] }];
            var m = /^\s*المرحلة\s+(\S+)\s*$/.exec(o.d[2] || ""), k = m ? STAGE_NAMES.indexOf(m[1]) : -1;
            if (k >= 0) { submit(k + 1); return; }
            load();
          };
          box.appendChild(row);
        });
        $("list").after(box);
      });
    }
    var searchVersion = 0;
    $("qf").addEventListener("input", function () {
      var q = norm(this.value.trim());
      document.querySelectorAll("#list .cg-item").forEach(function (r) { r.style.display = !q || (r.dataset.t || "").indexOf(q) >= 0 ? "" : "none"; });
      var v = ++searchVersion; clearHits();
      if (q.length >= 2 && stack.length === 0) showHits(q, v);
    });

    function renderSteps() {
      [].forEach.call($("steps").children, function (s, i) { s.className = i < stack.length ? "done" : i === stack.length ? "on" : ""; });
      var p = $("path"); p.innerHTML = "";
      stack.forEach(function (s, i) {
        if (i) p.appendChild(document.createTextNode(" / "));
        var b = document.createElement("button"); b.textContent = s.name;
        b.onclick = function () { stack = stack.slice(0, i); load(); };
        p.appendChild(b);
      });
    }

    function load() {
      var request = ++loadVersion;
      var lv = stack.length;
      $("title").textContent = TITLES[lv]; $("qf").value = ""; $("msg").textContent = ""; searchVersion++; clearHits();
      $("qf").hidden = lv === 3;
      renderSteps();
      var list = $("list");
      if (lv === 3) {
        list.innerHTML = "";
        var g = document.createElement("div"); g.className = "jn-stages";
        list.appendChild(g);
        /* كل المراحل الثماني متاحة دائماً: الخادم ينشئ المرحلة عند التسجيل إن لم تكن موجودة */
        STAGE_NAMES.forEach(function (n, i) {
          var b = document.createElement("button"); b.type = "button"; b.textContent = n;
          b.onclick = function () { submit(i + 1); };
          g.appendChild(b);
        });
        return;
      }
      var path = ["universities?view=join", "colleges?view=join&university_id=", "departments?view=join&college_id="][lv] + (lv ? stack[lv - 1].id : "");
      list.innerHTML = '<div class="cg-empty">جارٍ التحميل…</div>';
      get(path).then(function (d) {
        if (request !== loadVersion) return;
        if (d && d.error === "unauthorized") { location.href = loginUrl(); return; }
        list.innerHTML = "";
        var items = (d && d.items) || [];
        if (!items.length) list.innerHTML = '<div class="cg-empty">لا توجد عناصر. تواصل معنا لإضافتها.</div>';
        items.forEach(function (it) {
          var row = document.createElement("div"); row.className = "cg-item";
          var name = document.createElement("span"); name.textContent = it.name_ar; row.appendChild(name);
          if (it.city) { var s = document.createElement("small"); s.textContent = it.city; row.appendChild(s); }
          row.dataset.t = norm(it.name_ar + " " + (it.name_en || "") + " " + (it.city || ""));
          row.onclick = function () {
            var m = /^\s*المرحلة\s+(\S+)\s*$/.exec(it.name_ar || ""), k = m ? STAGE_NAMES.indexOf(m[1]) : -1;
            stack.push({ id: it.id, name: it.name_ar });
            if (k >= 0) { stack.length = 3; submit(k + 1); return; } /* اسم القسم هو المرحلة نفسها: لا سؤال ثانٍ */
            load();
          };
          list.appendChild(row);
        });
      }).catch(function (error) {
        if (request !== loadVersion) return;
        if (error.code === "unauthorized") { location.href = loginUrl(); return; }
        IQApi.showError(list, error, load);
      });
    }

    function submit(stage) {
      var dep = stack[2];
      $("msg").textContent = "جارٍ التسجيل…";
      fetch("/api/catalog/join", {
        method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" },
        body: JSON.stringify({ department_id: dep.id, stage: stage, invite: INFO ? INV : undefined })
      }).then(function (r) { return r.json(); }).then(function (r) {
        if (!r.ok) {
          $("msg").textContent = r.error === "suspended" ? "هذه الجامعة موقوفة مؤقتاً. تواصل مع إدارة المنصة." :
            r.error === "unauthorized" ? "سجّل دخولك أولاً." : "تعذّر التسجيل، حاول مرة أخرى.";
          return;
        }
        if (r.university_state !== "active") { // الجامعة في الدليل لكنها غير مفعّلة بعد: نحفظ التسجيل ونوضّح الحالة
          $("list").innerHTML = '<div class="jn-done"><b>تم حفظ تسجيلك</b>جامعتك لم تُفعَّل في المنصة بعد. أرسل طلب تفعيل قسمك لتسرّع الإدارة تفعيله.</div>';
          var rb = document.createElement("button"); rb.type = "button"; rb.className = "btn btn-primary"; rb.textContent = "إرسال طلب تفعيل القسم";
          function sent() { rb.disabled = true; rb.textContent = "تم إرسال الطلب ✓"; $("msg").textContent = "سنفعّل قسمك قريباً، وستفتح صفحته تلقائياً عند التفعيل."; }
          rb.onclick = function () {
            rb.disabled = true; $("msg").textContent = "جارٍ الإرسال…";
            fetch("/api/activation-request", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ department_id: dep.id }) })
              .then(function (x) { return x.json(); }).then(function (x) { x.ok ? sent() : (rb.disabled = false, $("msg").textContent = "تعذّر إرسال الطلب، حاول مرة أخرى."); })
              .catch(function () { rb.disabled = false; $("msg").textContent = "تعذّر الاتصال بالخادم."; });
          };
          $("list").appendChild(rb);
          fetch("/api/activation-request?department_id=" + dep.id, { credentials: "same-origin" }).then(function (x) { return x.json(); }).then(function (x) { if (x && x.sent) sent(); }).catch(function () {});
          $("msg").textContent = "";
          return;
        }
        try { localStorage.setItem("iq.dept", JSON.stringify({ id: dep.id, name: dep.name + " — " + stack[1].name })); } catch (e) { /* لا شيء */ }
        $("list").innerHTML = '<div class="jn-done"><b>تم تسجيلك بنجاح</b>جارٍ فتح صفحة قسمك…</div>';
        $("msg").textContent = "";
        setTimeout(function () { location.href = "platform.html?dept=" + dep.id; }, 900);
      }).catch(function () { $("msg").textContent = "تعذّر الاتصال بالخادم."; });
    }

    // رابط دعوة: يملأ الجامعة والكلية والقسم (والمرحلة إن كان رابط مرحلة) من الرابط
    function fromInvite(i) {
      INFO = i;
      stack = [{ id: i.university_id, name: i.university }, { id: i.college_id, name: i.college }, { id: i.department_id, name: i.department }];
      $("lead").textContent = "دعوة للانضمام إلى " + i.department + " — " + i.university + ".";
      if (i.stage) {
        $("title").textContent = "تأكيد التسجيل"; $("qf").hidden = true; renderSteps();
        $("list").innerHTML = "";
        var b = document.createElement("button"); b.type = "button"; b.className = "btn btn-primary";
        b.textContent = "انضم إلى المرحلة " + STAGE_NAMES[i.stage - 1] + " في " + i.department;
        b.onclick = function () { submit(i.stage); };
        $("list").appendChild(b);
      } else load();
    }

    // الطالب المسجّل مسبقاً يذهب إلى قسمه، إلا إن طلب تغيير قسمه
    var change = /[?&]change=1/.test(location.search);
    get("me").then(function (d) {
      if (d && d.error === "unauthorized") { location.href = loginUrl(); return; }
      if (INV) {
        return fetch("/api/invite?code=" + encodeURIComponent(INV), { credentials: "same-origin" }).then(function (r) { return r.json(); }).then(function (i) {
          if (i && i.ok) fromInvite(i);
          else { $("msg").textContent = "رابط الدعوة غير صالح أو أُوقف. اختر جامعتك يدوياً."; INV = ""; load(); }
        });
      }
      if (d && d.profile && !change) {
        $("lead").textContent = "تسجيلك الحالي: " + d.profile.department + " — " + d.profile.university + ". ما تختاره أدناه يغيّر تسجيلك إلى القسم الجديد.";
      }
      load();
    }).catch(function (error) {
      if (error.code === "unauthorized") { location.href = loginUrl(); return; }
      IQApi.showError($("list"), error);
    });
  })();
  </script>
  <script src="js/upload-link.js?v=2"></script>
</body>
</html>
