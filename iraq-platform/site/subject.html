<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>المادة | دفعتنا</title>
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <meta name="theme-color" content="#0A1C4E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/iq.css?v=11"><link rel="stylesheet" href="css/dfa.css?v=3">
</head>
<body>
  <header class="iq-top">
    <a class="iq-brand" href="/"><img class="dfa-mark" src="assets/brand.svg" width="32" height="32" alt=""><span>دفعتنا</span></a>
    <nav><a href="catalog.html">الجامعات</a><a href="contribute.html" data-upload-link hidden>رفع ملف</a><a class="iq-login" href="login.html">دخول</a></nav>
  </header>
  <main class="sj">
    <div class="sj-top"><a href="catalog.html">← الجامعات</a><a id="up" href="contribute.html" data-upload-link hidden>رفع ملف لهذه المادة</a></div>
    <div class="crumb" id="crumb"></div>
    <h1 id="title">…</h1>
    <p id="meta" class="crumb"></p>
    <div id="pendBox" hidden><h2>بانتظار الموافقة</h2><div id="pend"></div></div>
    <div id="files"></div>
  </main>
  <script src="js/api-client.js"></script>
  <script>
  (function () {
    var $ = function (i) { return document.getElementById(i); };
    var id = Number(new URLSearchParams(location.search).get("id"));
    var cid = "s" + id;
    var TYPE = { lecture: "محاضرات", quiz: "اختبارات", exam: "أسئلة سنوات سابقة" };
    var canReview = false;

    function post(p, body) {
      return fetch("/api/" + p, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) }).then(function (r) { return r.json(); });
    }
    function el(tag, text, cls) { var e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }
    function href(it) { return it.kind === "link" ? it.url : "/api/file/" + it.id; }

    function size(b) { b = Number(b); return b > 0 ? (b >= 1048576 ? (b / 1048576).toFixed(1) + " ميغا" : Math.max(1, Math.round(b / 1024)) + " كيلوبايت") : ""; }
    function nameOf(it) { return it.number ? "المحاضرة " + it.number + (it.title ? " — " + it.title : "") : (it.label || it.title || "ملف"); }
    /* زر يُعطَّل أثناء الطلب ويعرض رفض الخادم بجانب العنصر */
    function act(btn, row, p, body, done) {
      btn.disabled = true;
      post(p, body).then(function (d) {
        if (d && d.ok) return done ? done() : load();
        btn.disabled = false;
        var m = row.querySelector(".sj-err") || row.appendChild(el("p", null, "sj-err"));
        m.textContent = d && d.error === "forbidden" ? "لا تملك صلاحية هذا الإجراء." : "تعذّر تنفيذ الطلب، حاول مرة أخرى.";
      }).catch(function () { btn.disabled = false; });
    }
    function row(it, pending) {
      var r = el("div", null, "sj-item" + (pending ? " sj-pend" : ""));
      var left = el("div", null, "sj-main");
      var a = el("a", nameOf(it), "sj-name");
      a.href = href(it); a.target = "_blank"; a.rel = "noopener"; a.dir = "auto";
      left.appendChild(a);
      var meta = [it.number ? it.label : "", it.added || "", size(it.size)].filter(Boolean).join(" · ");
      if (meta) left.appendChild(el("small", meta, "sj-meta"));
      if (pending) left.appendChild(el("span", "بانتظار الموافقة", "sj-tag"));
      r.appendChild(left);
      var acts = el("div", null, "sj-act");
      if (it.kind !== "link") { var an = el("a", "✎ اكتب وظلّل"); an.href = "pdf-notes.html?file=" + encodeURIComponent(href(it)); acts.appendChild(an); }
      if (pending && canReview) {
        var ok = el("button", "قبول"), no = el("button", "رفض");
        ok.onclick = function () { act(ok, r, "review", { id: it.id, action: "approve" }); };
        no.onclick = function () { act(no, r, "review", { id: it.id, action: "reject" }); };
        acts.appendChild(ok); acts.appendChild(no);
      } else if (!pending) {
        var rp = el("button", "إبلاغ");
        rp.onclick = function () {
          rp.hidden = true;
          var f = el("div", null, "sj-rep"), inp = el("input"), send = el("button", "إرسال");
          inp.placeholder = "سبب الإبلاغ (حقوق نشر، ملف خاطئ...)"; inp.maxLength = 300; inp.setAttribute("aria-label", "سبب الإبلاغ");
          send.onclick = function () {
            if (!inp.value.trim()) { inp.focus(); return; }
            send.disabled = true;
            post("report", { id: it.id, reason: inp.value }).then(function (d) { if (d.ok) f.textContent = "شكراً، تم استلام البلاغ."; else { send.disabled = false; f.appendChild(el("p", "تعذّر الإرسال، حاول مرة أخرى.", "sj-err")); } });
          };
          f.appendChild(inp); f.appendChild(send); r.appendChild(f); inp.focus();
        };
        acts.appendChild(rp);
      }
      if (canReview) {
        var del = el("button", "حذف");
        del.onclick = function () { if (confirm("حذف «" + nameOf(it) + "» من المنصة نهائياً؟ لن يراه الطلاب بعد الآن.")) act(del, r, "delete", { id: it.id }); };
        acts.appendChild(del);
      }
      r.appendChild(acts);
      return r;
    }

    function render(items) {
      var box = $("files"); box.innerHTML = "";
      var ok = items.filter(function (i) { return !i.status || i.status === "approved"; });
      var pend = items.filter(function (i) { return i.status === "pending"; });
      if (!ok.length) box.appendChild(el("div", "لا توجد ملفات معتمدة بعد.", "sj-empty"));
      ["lecture", "quiz", "exam"].forEach(function (t) {
        var list = ok.filter(function (i) { return i.type === t; }).sort(function (a, b) { return a.number - b.number; });
        if (!list.length) return;
        box.appendChild(el("h2", TYPE[t]));
        list.forEach(function (i) { box.appendChild(row(i, false)); });
      });
      $("pendBox").hidden = !(canReview && pend.length);
      var p = $("pend"); p.innerHTML = "";
      if (canReview) pend.forEach(function (i) { p.appendChild(row(i, true)); });
    }

    function load() {
      var src = canReview ? post("admin") : fetch("/api/uploads").then(function (r) { return r.json(); });
      src.then(function (d) {
        render(((d && d.items) || []).filter(function (i) { return i.courseId === cid; }));
      });
    }

    IQApi.request("/api/catalog/subject?id=" + id).then(function (d) {
      if (!d.ok) { $("title").textContent = "المادة غير موجودة"; return; }
      var s = d.item;
      $("title").textContent = s.name_ar;
      $("crumb").textContent = s.university + " / " + s.college + " / " + s.department;
      $("meta").textContent = "المرحلة " + s.stage + " — الكورس " + s.term + (s.professor ? " — " + s.professor : "");
      document.title = s.name_ar + " | دفعتنا";
      $("up").href = "contribute.html?subject=" + id;
      canReview = !!d.can; // الإدارة حسب نطاق المستخدم (ممثل هذا القسم/الكلية/الجامعة أو المشرف العام)
      load();
    }).catch(function (error) { $("title").textContent = "تعذّر تحميل المادة"; IQApi.showError($("meta"), error); });
  })();
  </script>
  <script src="js/upload-link.js?v=2"></script>
</body>
</html>
