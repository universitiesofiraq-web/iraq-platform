<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>اختر مرحلتك | المنصة العراقية</title>
  <meta name="description" content="اختر مرحلتك الدراسية ليفتح الموقع على موادّها مباشرة.">
  <meta name="theme-color" content="#13294B">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/iq.css?v=3">
  <style>
    .sg-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin:18px 0}
    .sg-grid button{min-height:64px;padding:12px 16px;border-radius:14px;border:1px solid var(--line,#2a3a6a);background:rgba(255,255,255,.04);color:inherit;font:inherit;font-weight:600;cursor:pointer;text-align:start}
    .sg-grid button small{display:block;font-weight:400;opacity:.7;margin-top:4px}
    .sg-grid button:hover{background:rgba(255,255,255,.09)}
    .sg-note{opacity:.75;font-size:.95rem}
  </style>
</head>
<body>
  <header class="iq-top">
    <a class="iq-brand" href="/"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="7" y="7" width="18" height="18" rx="2" fill="#E0A93B"/><rect x="7" y="7" width="18" height="18" rx="2" transform="rotate(45 16 16)" fill="#E0A93B"/><circle cx="16" cy="16" r="4" fill="#0A1C4E"/></svg><span>المنصة العراقية</span></a>
    <nav><a href="catalog.html">الجامعات</a><a href="contribute.html" data-upload-link hidden>رفع ملف</a><a class="iq-login" href="login.html">دخول</a></nav>
  </header>
  <main class="sj">
    <div class="sj-top"><a id="back" href="catalog.html">← رجوع</a></div>
    <div class="crumb" id="crumb"></div>
    <h1>اختر مرحلتك</h1>
    <p class="sg-note">تُحفظ مرحلتك على هذا الجهاز، ويفتح الموقع عليها مباشرة في كل مرة. يمكنك تغييرها لاحقاً.</p>
    <div class="sg-grid" id="grid"></div>
    <p class="sg-note" id="msg">جارٍ التحميل…</p>
  </main>
  <script src="js/api-client.js"></script>
  <script>
  (function () {
    var $ = function (i) { return document.getElementById(i); };
    var dept = Number(new URLSearchParams(location.search).get("dept")) || 0;
    if (!dept) { location.replace("catalog.html"); return; }

    function go(stage) {
      try { localStorage.setItem("iq.stage", JSON.stringify({ dept: dept, stage: stage })); } catch (e) { /* لا شيء */ }
      location.href = "platform.html?dept=" + dept + "&stage=" + stage;
    }

    IQApi.request("/api/platform?dept=" + dept).then(function (d) {
      if (!d.ok) { $("msg").textContent = "تعذّر تحميل القسم."; return; }
      $("crumb").textContent = d.site.university + " / " + d.site.college;
      document.title = "اختر مرحلتك — " + d.site.department + " | المنصة العراقية";

      var seen = {}, stages = [];
      (d.semesters || []).forEach(function (s) {
        var st = Math.floor(s.id / 10);
        if (!seen[st]) { seen[st] = { n: st, subjects: 0 }; stages.push(seen[st]); }
      });
      (d.courses || []).forEach(function (c) { var st = Math.floor(c.semester / 10); if (seen[st]) seen[st].subjects++; });
      stages.sort(function (a, b) { return a.n - b.n; });

      if (stages.length < 2) { go(stages.length ? stages[0].n : 1); return; }

      var AR = ["", "الأولى", "الثانية", "الثالثة", "الرابعة", "الخامسة", "السادسة", "السابعة", "الثامنة"];
      var g = $("grid");
      stages.forEach(function (s) {
        var b = document.createElement("button");
        b.type = "button";
        b.appendChild(document.createTextNode("المرحلة " + (AR[s.n] || s.n)));
        var sm = document.createElement("small");
        sm.textContent = s.subjects ? s.subjects + " مادة" : "لا توجد مواد بعد";
        b.appendChild(sm);
        b.onclick = function () { go(s.n); };
        g.appendChild(b);
      });
      $("msg").textContent = "";
    }).catch(function (error) { IQApi.showError($("msg"), error); });
  })();
  </script>
  <script src="js/upload-link.js"></script>
</body>
</html>
